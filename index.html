<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE X - PRO EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cyan: #00f5ff; --blue: #0066ff; --purple: #7b2fff; --green: #00ff88; --red: #ff4466;
            --bg: #020810; --card: rgba(255,255,255,0.03); --border: rgba(0,245,255,0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Heebo', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; height: 100vh; }

        #bg-canvas { position: fixed; inset: 0; z-index: -1; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; position: relative; z-index: 10; }

        /* Header & Stats */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; background: var(--card); border-radius: 20px; 
            border: 1px solid var(--border); margin-bottom: 15px; backdrop-filter: blur(10px); 
        }
        .logo { font-family: 'Orbitron'; font-weight: 900; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); font-size: 1.2rem; }
        .streak-badge { display: none; background: linear-gradient(to top, #ff4500, #ff8c00); padding: 5px 12px; border-radius: 20px; font-family: 'Orbitron'; font-size: 12px; font-weight: 900; color: #fff; box-shadow: 0 0 15px #ff4500; animation: bounce 0.5s infinite alternate; }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-3px); } }

        /* Loading Screen Overlay */
        #loader { 
            position: fixed; inset: 0; background: var(--bg); z-index: 1000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        #loader.active { opacity: 1; pointer-events: all; }
        .spinner { width: 50px; height: 50px; border: 3px solid transparent; border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Screens */
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }

        /* Question Card & Shake */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 25px; padding: 25px; backdrop-filter: blur(15px); transition: 0.3s; }
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Subject Buttons */
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .subject-btn { 
            background: var(--card); border: 1px solid var(--border); padding: 25px 15px; 
            border-radius: 20px; color: #fff; cursor: pointer; transition: 0.3s;
        }
        .subject-btn:hover:not(:disabled) { border-color: var(--cyan); transform: scale(1.03); background: rgba(0,245,255,0.05); }
        .subject-btn:disabled { opacity: 0.2; filter: grayscale(1); }

        /* Options */
        .option {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            padding: 18px; border-radius: 15px; color: #fff; text-align: right; 
            margin-bottom: 10px; cursor: pointer; transition: 0.2s; font-size: 16px;
            -webkit-tap-highlight-color: transparent; /* מניעת מסגרת כחולה במובייל */
        }
        .option.correct { background: var(--green) !important; color: #000; border-color: var(--green); font-weight: bold; }
        .option.wrong { background: var(--red) !important; color: #fff; border-color: var(--red); }
        .option.hint-hidden { opacity: 0.2; pointer-events: none; filter: blur(1px); }

        /* UI Elements */
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--cyan); width: 0%; transition: 0.4s; }
        
        .hint-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-hint { background: none; border: 1px solid var(--purple); color: var(--purple); padding: 5px 15px; border-radius: 15px; cursor: pointer; font-size: 12px; font-family: 'Orbitron'; transition: 0.3s; }
        .btn-hint:disabled { opacity: 0.3; border-color: gray; color: gray; }

        .btn-next { width: 100%; padding: 18px; border-radius: 50px; border: none; font-family: 'Orbitron'; font-weight: 900; background: var(--cyan); color: #000; cursor: pointer; margin-top: 15px; display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .logo { font-size: 1rem; }
            .option { padding: 14px; font-size: 15px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p style="margin-top:15px; color:var(--cyan); font-family:'Orbitron';">SYNCING DATA...</p></div>
<canvas id="bg-canvas"></canvas>

<div class="container">
    <header>
        <div class="logo">SCIENCE X</div>
        <div id="streak" class="streak-badge">🔥 <span id="streakCount">0</span> STREAK</div>
        <div style="font-family: 'Orbitron'; font-size: 13px;">XP: <span id="xpVal" style="color:var(--cyan)">0</span></div>
    </header>

    <div id="menu-screen" class="screen active">
        <div style="background:rgba(255,68,102,0.1); border:1px solid var(--red); color:var(--red); padding:10px; border-radius:10px; text-align:center; font-size:12px; margin-bottom:20px; font-weight:bold;">
            ⚠️ אזהרה: המידע לימודי בלבד. אין להשתמש בו לייעוץ רפואי!
        </div>
        <div class="subject-grid">
            <button class="subject-btn" onclick="prepareQuiz('רפואה')"><h3>MEDICAL</h3><span>רפואה</span></button>
            <button class="subject-btn" onclick="prepareQuiz('פיזיקה')"><h3>PHYSICS</h3><span>פיזיקה</span></button>
            <button class="subject-btn" onclick="prepareQuiz('כימיה')"><h3>CHEMISTRY</h3><span>כימיה</span></button>
            <button id="lvl2-btn" class="subject-btn" onclick="prepareQuiz('lvl2')" disabled><h3>LEVEL 2</h3><span>🔒 סיים רמה 1</span></button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="hint-bar">
            <span id="qCounter" style="font-size:11px; font-family:'Orbitron'; color:rgba(255,255,255,0.5);">QUESTION 1/10</span>
            <button id="hintBtn" class="btn-hint" onclick="applyHint()">50/50 HINT (-25 XP)</button>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="qCard" class="card">
            <h2 id="qText" style="margin-bottom: 25px; line-height:1.4;"></h2>
            <div id="opts"></div>
            <button id="nextBtn" class="btn-next" onclick="renderQuestion()">המשך למשימה הבאה ➔</button>
        </div>
    </div>

    <div id="finish-screen" class="screen card" style="text-align: center; padding: 40px 20px;">
        <h1 id="fTitle" style="font-family: 'Orbitron'; color: var(--green); margin-bottom:15px;">MISSION COMPLETE</h1>
        <p id="fText" style="font-size: 18px; margin-bottom:30px;"></p>
        <button class="btn-next" style="display:block" onclick="location.reload()">חזרה לתפריט</button>
    </div>
</div>

<script>
    // מאגר דוגמה - תדביק כאן את ה-JSON שלך
    const MASTER_DB = [
        {l:1, t:"רפואה", q:"מהו לחץ דם תקין?", o:["120/80","180/100","90/60","150/90"], a:0},
        {l:1, t:"פיזיקה", q:"מהי מהירות האור?", o:["300,000 קמ\"ש","300,000 קמ\"ש","1,000 קמ\"ש","100 קמ\"ש"], a:1},
        {l:2, t:"lvl2", q:"שאלה מתקדמת?", o:["תשובה 1","תשובה 2","תשובה 3","תשובה 4"], a:2}
    ];

    let quizSet = [], qIdx = 0, currentStreak = 0;
    let xp = parseInt(localStorage.getItem('user_xp')) || 0;
    let unlocked = parseInt(localStorage.getItem('user_lvl')) || 1;

    function init() {
        document.getElementById('xpVal').innerText = xp;
        if(unlocked >= 2) document.getElementById('lvl2-btn').disabled = false;
    }

    // אפקט טעינה לפני תחילת קוויז
    function prepareQuiz(type) {
        document.getElementById('loader').classList.add('active');
        setTimeout(() => {
            startQuiz(type);
            document.getElementById('loader').classList.remove('active');
        }, 600); 
    }

    function startQuiz(type) {
        quizSet = MASTER_DB.filter(q => (type==='lvl2' ? q.l===2 : (q.t===type && q.l===1))).sort(()=>Math.random()-0.5);
        if(!quizSet.length) return alert("אין שאלות בקטגוריה זו.");
        qIdx = 0; currentStreak = 0;
        showScreen('quiz-screen');
        renderQuestion();
    }

    function renderQuestion() {
        if(qIdx >= quizSet.length) return showFinish();
        const q = quizSet[qIdx];
        document.getElementById('qCard').classList.remove('shake');
        document.getElementById('qText').innerText = q.q;
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('qCounter').innerText = `QUESTION ${qIdx+1}/${quizSet.length}`;
        document.getElementById('hintBtn').disabled = (xp < 25);
        
        const optsDiv = document.getElementById('opts');
        optsDiv.innerHTML = '';
        q.o.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => check(i, btn, q.a);
            optsDiv.appendChild(btn);
        });
        document.getElementById('progress-fill').style.width = (qIdx/quizSet.length*100) + "%";
    }

    function check(idx, btn, correct) {
        const all = document.querySelectorAll('.option');
        all.forEach(b => b.disabled = true); // מניעת לחיצה כפולה

        if(idx === correct) {
            btn.classList.add('correct');
            currentStreak++;
            xp += (10 + currentStreak); // בונוס Streak
            confetti({ particleCount: 30 + (currentStreak*10), spread: 70, origin: { y: 0.8 } });
            if(currentStreak >= 3) {
                document.getElementById('streak').style.display = 'block';
                document.getElementById('streakCount').innerText = currentStreak;
            }
        } else {
            btn.classList.add('wrong');
            all[correct].classList.add('correct');
            document.getElementById('qCard').classList.add('shake'); // אפקט רעידה
            currentStreak = 0;
            document.getElementById('streak').style.display = 'none';
        }
        
        saveData();
        document.getElementById('nextBtn').style.display = 'block';
        qIdx++;
    }

    function applyHint() {
        if(xp < 25) return;
        const q = quizSet[qIdx];
        const all = Array.from(document.querySelectorAll('.option'));
        let count = 0;
        all.forEach((btn, i) => {
            if(i !== q.a && count < 2) {
                btn.classList.add('hint-hidden');
                count++;
            }
        });
        xp -= 25;
        saveData();
        document.getElementById('hintBtn').disabled = true;
    }

    function saveData() {
        localStorage.setItem('user_xp', xp);
        document.getElementById('xpVal').innerText = xp;
    }

    function showFinish() {
        showScreen('finish-screen');
        if(unlocked === 1) { unlocked = 2; localStorage.setItem('user_lvl', 2); }
        document.getElementById('fText').innerText = `המשימה הושלמה! צברת ${xp} נקודות XP סה"כ.`;
        confetti({ particleCount: 200, spread: 100 });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // רקע חלקיקים
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    for(let i=0; i<40; i++) pts.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:0.4, vy:0.4});
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "rgba(0, 245, 255, 0.15)";
        pts.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>canvas.width) p.vx*=-1; if(p.y<0||p.y>canvas.height) p.vy*=-1;
            ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(animate);
    }
    animate(); init();
</script>
</body>
</html>
