<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCIENCE X | THE ULTIMATE EDITION</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #00f5ff; --teal: #00d4aa; --red: #ff4466; --green: #00ff88; --bg: #020810;
  --border: rgba(0,245,255,0.2); --glass: rgba(0,245,255,0.03); --yellow: #ffcc00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:#e8f4f8;overflow-x:hidden;min-height:100vh; transition: background 0.3s;}

/* אפקטים ויזואליים */
.flash-correct { background-color: rgba(0, 255, 136, 0.1) !important; }
.flash-wrong { background-color: rgba(255, 68, 102, 0.1) !important; }
.shake { animation: shake 0.4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

#particles-canvas{position:fixed;inset:0;z-index:-1;}
.container { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; }

/* ─── דאשבורד בחירת מקצועות ─── */
.hero-header { margin-bottom: 50px; animation: fadeInDown 0.8s ease-out; }
.hero-title { font-family:'Orbitron'; font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight:900; color: var(--cyan); text-shadow: 0 0 30px rgba(0,245,255,0.5); }
.hero-subtitle { color: #6a8fa8; letter-spacing: 4px; font-size: 0.9rem; margin-top: 5px; font-family:'Orbitron'; }

.subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; }
.btn-cat {
    background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 30px 15px;
    color: var(--cyan); font-family: 'Orbitron'; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; gap: 12px;
    animation: slideUp 0.5s ease-out backwards;
}
.btn-cat i { font-size: 2.2rem; filter: drop-shadow(0 0 8px var(--cyan)); transition: 0.3s; }
.btn-cat span { font-family: 'Heebo'; font-weight: 800; font-size: 1.1rem; color: #fff; }
.btn-cat:hover { 
    background: rgba(0,245,255,0.12); border-color: var(--cyan); transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,245,255,0.2); 
}

/* ─── מסך המשחק ─── */
#quiz-screen { display: none; }
.game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.stat-pill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 6px 15px; border-radius: 12px; font-family:'Orbitron'; font-size: 0.85rem; color: var(--cyan); }
.back-btn { background: none; border: 1px solid var(--red); color: var(--red); padding: 6px 15px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
.back-btn:hover { background: var(--red); color: #fff; }

.progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 25px; border: 1px solid var(--border); overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--teal), var(--cyan)); width: 0%; transition: 0.5s cubic-bezier(0.1, 0.7, 1.0, 0.1); }

.card { background: rgba(7, 15, 30, 0.95); border: 1px solid var(--border); border-radius: 35px; padding: 40px; backdrop-filter: blur(20px); position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
.q-info { font-family: 'Orbitron'; font-size: 0.75rem; color: #6a8fa8; margin-bottom: 15px; letter-spacing: 2px; }
.q-text { font-size: 1.6rem; font-weight: 800; margin-bottom: 30px; line-height: 1.4; color: #fff; }

.opt {
    width: 100%; padding: 18px; margin-bottom: 12px; border-radius: 15px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.02); color: #e8f4f8; cursor: pointer; text-align: right; font-size: 1.1rem; transition: 0.2s;
}
.opt:hover:not(:disabled) { background: rgba(0,245,255,0.08); border-color: var(--cyan); }
.opt.correct { background: var(--green) !important; color: #000; font-weight: 900; border-color: var(--green); box-shadow: 0 0 20px rgba(0,255,136,0.3); }
.opt.wrong { background: var(--red) !important; color: #fff; border-color: var(--red); box-shadow: 0 0 20px rgba(255,68,102,0.3); }

.streak-txt { color: var(--yellow); font-family: 'Orbitron'; font-weight: 900; font-size: 1.4rem; margin-bottom: 15px; display: none; text-shadow: 0 0 15px var(--yellow); }
.explain-box { color: var(--teal); background: rgba(0,212,170,0.05); padding: 15px; border-radius: 12px; margin-top: 15px; display: none; border: 1px dashed var(--teal); font-size: 0.95rem; }

.btn-main { width: 100%; padding: 20px; background: var(--cyan); color: #000; border: none; border-radius: 18px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; margin-top: 20px; display: none; box-shadow: 0 0 25px rgba(0,245,255,0.4); }
.btn-light { background: none; border: 1px solid var(--yellow); color: var(--yellow); padding: 8px 15px; border-radius: 10px; cursor: pointer; margin-top: 15px; display: none; }

/* אנימציות כניסה */
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="container">
    <div id="menu-screen">
        <div class="hero-header">
            <h1 class="hero-title">SCIENCE X</h1>
            <p class="hero-subtitle">MASTER THE KNOWLEDGE</p>
        </div>
        
        <div class="subjects-grid">
            <button class="btn-cat" style="animation-delay: 0.1s" onclick="start('ביולוגיה')"><i>🧬</i><span>ביולוגיה</span></button>
            <button class="btn-cat" style="animation-delay: 0.2s" onclick="start('כימיה')"><i>🧪</i><span>כימיה</span></button>
            <button class="btn-cat" style="animation-delay: 0.3s" onclick="start('פיזיקה')"><i>⚡</i><span>פיזיקה</span></button>
            <button class="btn-cat" style="animation-delay: 0.4s" onclick="start('מתמטיקה')"><i>📐</i><span>מתמטיקה</span></button>
            <button class="btn-cat" style="animation-delay: 0.5s" onclick="start('אנגלית')"><i>🌍</i><span>אנגלית</span></button>
            <button class="btn-cat" style="animation-delay: 0.6s" onclick="start('רפואה')"><i>⚕️</i><span>רפואה</span></button>
        </div>
    </div>

    <div id="quiz-screen">
        <div class="game-header">
            <button class="back-btn" onclick="location.reload()">✖ חזרה</button>
            <div class="stat-pill">XP: <span id="xp-val">0</span></div>
        </div>
        
        <div class="progress-container"><div id="p-bar" class="progress-bar"></div></div>
        
        <div class="card" id="main-card">
            <div class="q-info" id="q-counter">MISSION PROGRESS: 0%</div>
            <div id="q-text" class="q-text"></div>
            
            <div id="options-box"></div>
            
            <div id="streak-msg" class="streak-txt">COMBO X2! 🔥</div>
            <div id="explain-content" class="explain-box"></div>
            
            <button id="next-btn" class="btn-main" onclick="renderNext()">NEXT MISSION ➔</button>
            <button id="explain-btn" class="btn-light" onclick="showExplanation()">💡 הסבר את התשובה</button>
        </div>
    </div>
</div>

<script src="questions.js"></script>

<script>
// קבצי סאונד
const sfxCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');
const sfxWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3');

let missionSet = [], cur = 0, xp = 0, streak = 0;

function start(cat) {
    if (typeof ALL === 'undefined') return alert("שגיאה: קובץ questions.js לא נמצא!");
    missionSet = ALL.filter(q => q.t === cat).sort(() => Math.random() - 0.5);
    if(missionSet.length === 0) return alert("אין שאלות בקטגוריה זו.");
    
    cur = 0; xp = 0; streak = 0;
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    renderNext();
}

function renderNext() {
    if(cur >= missionSet.length) {
        confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
        alert(`כל הכבוד! סיימת את המשימה עם ${xp} XP!`);
        location.reload();
        return;
    }
    
    const q = missionSet[cur];
    const card = document.getElementById('main-card');
    
    // איפוס מצב
    card.classList.remove('shake');
    document.getElementById('streak-msg').style.display = 'none';
    document.getElementById('explain-content').style.display = 'none';
    document.getElementById('explain-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    document.getElementById('q-counter').innerText = `QUESTION ${cur + 1} / ${missionSet.length}`;
    document.getElementById('q-text').innerText = q.q;
    
    const box = document.getElementById('options-box');
    box.innerHTML = '';
    
    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerText = opt;
        btn.onclick = () => check(i, btn, q.a, q.e);
        box.appendChild(btn);
    });

    document.getElementById('p-bar').style.width = (cur / missionSet.length) * 100 + "%";
}

function check(idx, btn, ans, explain) {
    const btns = document.querySelectorAll('.opt');
    const body = document.body;
    btns.forEach(b => b.disabled = true);
    
    if(idx === ans) {
        streak++;
        xp += (10 + (streak * 5));
        btn.classList.add('correct');
        body.classList.add('flash-correct');
        setTimeout(() => body.classList.remove('flash-correct'), 300);
        sfxCorrect.play().catch(()=>{});
        
        if(streak > 1) {
            const sm = document.getElementById('streak-msg');
            sm.innerText = `COMBO X${streak}! 🔥`;
            sm.style.display = 'block';
        }
        confetti({ particleCount: 25 + (streak * 10), spread: 60, colors: ['#00f5ff', '#00ff88'] });
    } else {
        streak = 0;
        btn.classList.add('wrong');
        btns[ans].classList.add('correct');
        body.classList.add('flash-wrong');
        setTimeout(() => body.classList.remove('flash-wrong'), 300);
        document.getElementById('main-card').classList.add('shake');
        sfxWrong.play().catch(()=>{});
    }
    
    if(explain) {
        document.getElementById('explain-content').innerText = explain;
        document.getElementById('explain-btn').style.display = 'inline-block';
    }
    
    cur++;
    document.getElementById('xp-val').innerText = xp;
    document.getElementById('next-btn').style.display = 'block';
}

function showExplanation() {
    document.getElementById('explain-content').style.display = 'block';
    document.getElementById('explain-btn').style.display = 'none';
}

// חלקיקי רקע
(function(){
  const canvas=document.getElementById('particles-canvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  window.onresize=resize; resize();
  let pts = Array(45).fill().map(() => ({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-0.5)*0.6, vy:(Math.random()-0.5)*0.6}));
  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="rgba(0,245,255,0.15)";
    pts.forEach(p => {
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,1.3,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
