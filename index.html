<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE X | MAOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cyan: #00f5ff; --red: #ff3e3e; --green: #00ff88; --bg: #03070c;
            --carbon: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.04) 1px, transparent 0);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { 
            font-family: 'Heebo', sans-serif; background: var(--bg); color: #fff; 
            overflow-x: hidden; min-height: 100vh;
            background-image: var(--carbon); background-size: 6px 6px;
        }

        #particles-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.3; }
        .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

        /* --- UI HEADER --- */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px; }
        .brand { font-family: 'Orbitron'; font-weight: 900; font-size: 1.8rem; color: var(--cyan); text-shadow: 0 0 15px rgba(0,245,255,0.5); }
        
        .controls { display: flex; gap: 15px; align-items: center; }
        .sound-toggle { background: rgba(255,255,255,0.05); border: 1px solid var(--cyan); color: var(--cyan); padding: 5px 12px; border-radius: 5px; cursor: pointer; font-family: 'Orbitron'; font-size: 10px; }

        .hud { 
            display: flex; gap: 20px; align-items: center; background: rgba(255,255,255,0.03); 
            padding: 12px 25px; border-radius: 50px; border: 1px solid rgba(0,245,255,0.15); backdrop-filter: blur(10px);
        }

        /* --- PRO HEARTS (SVG) --- */
        .hearts-box { display: flex; gap: 8px; }
        .heart-icon { width: 22px; height: 22px; fill: var(--red); filter: drop-shadow(0 0 5px var(--red)); transition: 0.3s; }
        .heart-icon.lost { fill: #1a1a1a; filter: none; opacity: 0.3; }

        /* --- XP BAR --- */
        .xp-engine { width: 100%; margin-bottom: 30px; }
        .xp-info { display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 11px; margin-bottom: 8px; color: var(--cyan); }
        .xp-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        #xp-bar { height: 100%; width: 0%; background: var(--cyan); box-shadow: 0 0 15px var(--cyan); transition: 0.6s; }

        /* --- SCREENS --- */
        .card { 
            background: rgba(10, 15, 25, 0.95); border: 1px solid rgba(0,245,255,0.1); 
            border-radius: 30px; padding: 40px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .streak-fire { 
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(to bottom, #ff8800, #ff4400); padding: 10px 25px;
            border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; display: none;
            box-shadow: 0 0 20px #ff4400; animation: pulse 0.4s infinite alternate;
        }
        @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.1); } }

        .q-text { font-size: 1.8rem; font-weight: 900; margin-bottom: 30px; line-height: 1.3; text-align: center; }

        .opt-grid { display: grid; gap: 12px; }
        .opt-btn { 
            width: 100%; padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02); color: #fff; cursor: pointer; text-align: right;
            font-size: 1.1rem; transition: 0.2s;
        }
        .opt-btn:hover:not(:disabled) { background: rgba(0,245,255,0.08); border-color: var(--cyan); }
        .opt-btn.correct { background: var(--green) !important; color: #000; font-weight: 900; border-color: var(--green); }
        .opt-btn.wrong { background: var(--red) !important; border-color: var(--red); }

        .next-btn { width: 100%; padding: 20px; background: var(--cyan); color: #000; border: none; border-radius: 15px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; margin-top: 25px; display: none; }

        /* --- MENU --- */
        .sector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
        .sector-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0,245,255,0.1); padding: 40px 20px; border-radius: 25px; cursor: pointer; text-align: center; transition: 0.3s; }
        .sector-card:hover { border-color: var(--cyan); background: rgba(0,245,255,0.08); transform: translateY(-5px); }
        .sector-card h3 { font-family: 'Orbitron'; color: var(--cyan); margin-top: 10px; }

        footer { margin-top: 60px; text-align: center; font-family: 'Orbitron'; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 2px; }
        .maor { color: var(--cyan); font-weight: bold; }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="container">
    <header>
        <div class="brand">SCIENCE X</div>
        <div class="controls">
            <button class="sound-toggle" onclick="toggleSound()" id="soundBtn">SOUND: ON</button>
            <div class="hud">
                <div class="hearts-box" id="hearts-ui">
                    <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div id="xp-num" style="font-family:'Orbitron'; font-weight:900; color:var(--cyan);">0 XP</div>
            </div>
        </div>
    </header>

    <div class="xp-engine">
        <div class="xp-info"><span>SYSTEM SYNC</span><span id="rank">RANK: INITIATE</span></div>
        <div class="xp-track"><div id="xp-bar"></div></div>
    </div>

    <div id="menu-screen">
        <div class="sector-grid">
            <div class="sector-card" onclick="start('ביולוגיה')"><h2>🧬</h2><h3>BIOLOGY</h3></div>
            <div class="sector-card" onclick="start('כימיה')"><h2>🧪</h2><h3>CHEMISTRY</h3></div>
            <div class="sector-card" onclick="start('פיזיקה')"><h2>⚡</h2><h3>PHYSICS</h3></div>
            <div class="sector-card" onclick="start('רפואה')"><h2>⚕️</h2><h3>MEDICAL</h3></div>
        </div>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="card">
            <div id="streak-fire" class="streak-fire">STREAK: <span id="fire-val">0</span> 🔥</div>
            <div class="q-text" id="q-label">Loading...</div>
            <div class="opt-grid" id="options"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">NEXT SEQUENCE ➔</button>
        </div>
    </div>

    <footer>
        DESIGNED & DEVELOPED BY <span class="maor">MAOR AVITBOL</span> &copy; 2026<br>
        SCIENCE X ENGINE V8.0 | SECURE CONNECTED
    </footer>
</div>

<script>
// --- AUDIO SYSTEM ---
let soundEnabled = true;
const sfx = {
    win: new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'),
    fail: new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'),
    clear: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3')
};

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').innerText = `SOUND: ${soundEnabled ? 'ON' : 'OFF'}`;
}

function play(key) { if(soundEnabled) { sfx[key].currentTime = 0; sfx[key].play(); } }

// --- DATA & LOGIC ---
let questions = [], pool = [], cur = 0, xp = 0, lives = 3, streak = 0;

async function load() {
    try {
        const r = await fetch('questions.json');
        questions = await r.json();
    } catch(e) { console.error("Missing Database."); }
}

function start(cat) {
    pool = questions.filter(q => q.t === cat).sort(() => 0.5 - Math.random());
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    nextQuestion();
}

function nextQuestion() {
    if(cur >= pool.length || lives <= 0) {
        play('clear');
        confetti({ particleCount: 200, spread: 70 });
        alert(lives > 0 ? "MISSION COMPLETE!" : "SYSTEM FAILURE.");
        location.reload();
        return;
    }

    const q = pool[cur];
    document.getElementById('q-label').innerText = q.q;
    const box = document.getElementById('options');
    box.innerHTML = '';
    
    q.o.forEach((text, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = text;
        btn.onclick = () => check(i, btn, q.a);
        box.appendChild(btn);
    });

    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('streak-fire').style.display = streak >= 3 ? 'block' : 'none';
    document.getElementById('fire-val').innerText = streak;
}

function check(idx, btn, correct) {
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    if(idx === correct) {
        btn.classList.add('correct');
        streak++;
        xp += (20 + streak * 5);
        play('win');
    } else {
        btn.classList.add('wrong');
        btns[correct].classList.add('correct');
        streak = 0;
        lives--;
        play('fail');
        updateLives();
    }

    updateUI();
    cur++;
    document.getElementById('next-btn').style.display = 'block';
}

function updateLives() {
    const hearts = document.querySelectorAll('.heart-icon');
    for(let i=0; i<3; i++) {
        if(i >= lives) hearts[2-i].classList.add('lost');
    }
}

function updateUI() {
    document.getElementById('xp-num').innerText = `${xp} XP`;
    const progress = Math.min((xp / 1000) * 100, 100);
    document.getElementById('xp-bar').style.width = progress + "%";
    if(xp > 500) document.getElementById('rank').innerText = "RANK: ELITE";
}

load();

// Background
(function(){
    const c = document.getElementById('particles-canvas');
    const ctx = c.getContext('2d');
    let w, h;
    function r(){ w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
    window.onresize = r; r();
    function d(){
        ctx.clearRect(0,0,w,h); ctx.fillStyle = "#00f5ff";
        for(let i=0; i<35; i++){
            ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, 1, 0, Math.PI*2); ctx.fill();
        }
        setTimeout(() => requestAnimationFrame(d), 100);
    }
    d();
})();
</script>
</body>
</html>
