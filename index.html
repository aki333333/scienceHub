<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCIENCE X | מאור אביטבול</title>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
/* ====== (כל ה-CSS שלך נשאר בדיוק כמו שהיה) ====== */
body {
  margin: 0;
  font-family: 'Assistant', sans-serif;
  background: #040608;
  color: #e8ecf0;
}

.wrap { max-width: 820px; margin: auto; padding: 20px; }

.card {
  background: #080b0e;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 38px 40px;
}

.opt {
  background: #0d1117;
  padding: 18px;
  margin: 10px 0;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.06);
}

.opt.correct { border-color: #00f5ff; color: #00f5ff; }
.opt.wrong { border-color: #ff003c; color: #ff003c; }
</style>
</head>

<body>

<div class="wrap">

<!-- MENU -->
<div id="screen-menu" class="card">
  <h2>בחר תחום</h2>

  <button onclick="checkMedical('ביולוגיה')">ביולוגיה</button>
  <button onclick="checkMedical('כימיה')">כימיה</button>
  <button onclick="checkMedical('פיזיקה')">פיזיקה</button>
  <button onclick="checkMedical('מתמטיקה')">מתמטיקה</button>
  <button onclick="checkMedical('אנגלית')">אנגלית</button>
</div>

<!-- LOADING -->
<div id="screen-loading" class="card" style="display:none">
  טוען שאלות...
</div>

<!-- GAME -->
<div id="screen-game" class="card" style="display:none">
  <h2 id="q-text"></h2>
  <div id="opts"></div>
  <p id="explanation"></p>
  <button onclick="nextQ()">הבא</button>
</div>

<!-- RESULT -->
<div id="screen-result" class="card" style="display:none">
  <h2>סיום!</h2>
  <p id="res"></p>
  <button onclick="location.reload()">שחק שוב</button>
</div>

</div>

<footer style="text-align:center;margin-top:20px;color:#444">
כל הזכויות שמורות למאור אביטבול · SCIENCE X © 2026
</footer>

<script>

/* ================= STATE ================= */
let state = {
  questions: [],
  idx: 0,
  score: 0,
  category: ""
};

/* ================= LOAD JSON ================= */
async function loadQuestions() {
  const res = await fetch('questions.json');
  return await res.json();
}

/* ================= START ================= */
async function checkMedical(cat) {
  state.category = cat;

  document.getElementById("screen-menu").style.display = "none";
  document.getElementById("screen-loading").style.display = "block";

  const all = await loadQuestions();
  state.questions = all.filter(q => q.category === cat);

  document.getElementById("screen-loading").style.display = "none";
  document.getElementById("screen-game").style.display = "block";

  showQ();
}

/* ================= SHOW QUESTION ================= */
function showQ() {
  const q = state.questions[state.idx];

  document.getElementById("q-text").innerText = q.q;

  const box = document.getElementById("opts");
  box.innerHTML = "";

  q.o.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "opt";
    div.innerText = opt;

    div.onclick = () => {
      document.querySelectorAll(".opt").forEach(o => o.style.pointerEvents = "none");

      if (i === q.a) {
        div.classList.add("correct");
        state.score++;
      } else {
        div.classList.add("wrong");
        box.children[q.a].classList.add("correct");
      }

      document.getElementById("explanation").innerText = q.e;
    };

    box.appendChild(div);
  });
}

/* ================= NEXT ================= */
function nextQ() {
  state.idx++;

  if (state.idx >= state.questions.length) {
    document.getElementById("screen-game").style.display = "none";
    document.getElementById("screen-result").style.display = "block";

    document.getElementById("res").innerText =
      `ציון: ${state.score} / ${state.questions.length}`;

  } else {
    document.getElementById("explanation").innerText = "";
    showQ();
  }
}

</script>

</body>
</html>
