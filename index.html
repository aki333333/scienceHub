<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCIENCE X | PRO EDITION</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #00f5ff; --teal: #00d4aa; --red: #ff4466; --green: #00ff88; --bg: #020810;
  --surface: rgba(0,245,255,0.04); --border: rgba(0,245,255,0.12); --text: #e8f4f8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;height:100vh;}

/* ─── רקע ואנימציות ─── */
#particles-canvas{position:fixed;inset:0;z-index:-1;}
.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

/* ─── מבנה מרכזי ─── */
.container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
.hero-title { font-family:'Orbitron'; font-size: 3rem; font-weight:900; color: var(--cyan); text-shadow: 0 0 20px rgba(0,245,255,0.5); margin-bottom: 2rem; }

/* ─── כפתורי תפריט ─── */
.subjects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
.btn-cat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 25px;
    color: var(--cyan); font-family: 'Orbitron'; font-weight: 700; cursor: pointer; transition: 0.3s;
}
.btn-cat:hover { border-color: var(--cyan); transform: translateY(-3px); background: rgba(0,245,255,0.1); }

/* ─── כרטיס שאלה ─── */
#quiz-screen { display: none; margin-top: 20px; }
.card { background: rgba(10, 20, 40, 0.8); border: 1px solid var(--border); border-radius: 25px; padding: 30px; backdrop-filter: blur(10px); }
.q-text { font-size: 1.4rem; font-weight: 800; margin-bottom: 25px; line-height: 1.4; }

.opt {
    width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.03); color: var(--text); cursor: pointer; text-align: right; font-size: 1.1rem; transition: 0.2s;
}
.opt.correct { background: var(--green) !important; color: #000; font-weight: bold; border-color: var(--green); box-shadow: 0 0 15px var(--green); }
.opt.wrong { background: var(--red) !important; color: #fff; border-color: var(--red); box-shadow: 0 0 15px var(--red); }

.topbar { display: flex; justify-content: space-between; margin-bottom: 15px; font-family: 'Orbitron'; color: var(--cyan); font-size: 0.9rem; }
.btn-next {
    width: 100%; padding: 18px; background: var(--cyan); color: #000; border: none; border-radius: 12px;
    font-family: 'Orbitron'; font-weight: 900; cursor: pointer; margin-top: 15px; display: none;
}
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="container">
    <div id="menu-screen">
        <h1 class="hero-title">SCIENCE X</h1>
        <p style="color:#6a8fa8; margin-bottom:30px;">בחר תחום להתחלת המשימה</p>
        <div class="subjects-grid">
            <button class="btn-cat" onclick="start('ביולוגיה')">BIOLOGY<br><span style="font-size:0.8rem; font-family:'Heebo'">ביולוגיה</span></button>
            <button class="btn-cat" onclick="start('כימיה')">CHEMISTRY<br><span style="font-size:0.8rem; font-family:'Heebo'">כימיה</span></button>
            <button class="btn-cat" onclick="start('פיזיקה')">PHYSICS<br><span style="font-size:0.8rem; font-family:'Heebo'">פיזיקה</span></button>
            <button class="btn-cat" onclick="start('מתמטיקה')">MATH<br><span style="font-size:0.8rem; font-family:'Heebo'">מתמטיקה</span></button>
            <button class="btn-cat" onclick="start('אנגלית')">ENGLISH<br><span style="font-size:0.8rem; font-family:'Heebo'">אנגלית</span></button>
            <button class="btn-cat" onclick="start('רפואה')">MEDICAL<br><span style="font-size:0.8rem; font-family:'Heebo'">רפואה</span></button>
        </div>
    </div>

    <div id="quiz-screen">
        <div class="topbar">
            <div id="cat-label">SUBJECT</div>
            <div>XP: <span id="xp-val">0</span></div>
        </div>
        <div class="card" id="main-card">
            <div id="q-text" class="q-text"></div>
            <div id="options-box"></div>
            <button id="next-btn" class="btn-next" onclick="renderNext()">NEXT MISSION ➔</button>
        </div>
        <button style="margin-top:20px; background:none; border:none; color:#6a8fa8; cursor:pointer;" onclick="location.reload()">← חזרה לתפריט</button>
    </div>
</div>

<script src="questions.js"></script>

<script>
// סאונדים
const sfxCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');
const sfxWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3');

let missionSet = [], cur = 0, xp = 0;

function start(cat) {
    if (typeof ALL === 'undefined') {
        alert("שגיאה: קובץ questions.js לא נמצא!");
        return;
    }
    missionSet = ALL.filter(q => q.t === cat).sort(() => Math.random() - 0.5);
    if(missionSet.length === 0) return alert("אין שאלות בקטגוריה זו.");
    
    cur = 0;
    document.getElementById('cat-label').innerText = cat;
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    renderNext();
}

function renderNext() {
    if(cur >= missionSet.length) {
        alert("סיימת את כל השאלות בקטגוריה!");
        location.reload();
        return;
    }
    
    const q = missionSet[cur];
    const card = document.getElementById('main-card');
    card.classList.remove('shake');
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('next-btn').style.display = 'none';
    
    const box = document.getElementById('options-box');
    box.innerHTML = '';
    
    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerText = opt;
        btn.onclick = () => check(i, btn, q.a);
        box.appendChild(btn);
    });
}

function check(idx, btn, ans) {
    const btns = document.querySelectorAll('.opt');
    btns.forEach(b => b.disabled = true);
    
    if(idx === ans) {
        // תשובה נכונה
        btn.classList.add('correct');
        xp += 15;
        sfxCorrect.play().catch(()=>{});
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.8 } }); // קונפטי רק פה!
    } else {
        // טעות
        btn.classList.add('wrong');
        btns[ans].classList.add('correct');
        document.getElementById('main-card').classList.add('shake'); // רעידה
        sfxWrong.play().catch(()=>{}); // סאונד טעות
    }
    
    cur++;
    document.getElementById('xp-val').innerText = xp;
    document.getElementById('next-btn').style.display = 'block';
}

// רקע חלקיקים עדין
(function(){
  const canvas=document.getElementById('particles-canvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  window.onresize=resize; resize();
  let pts = Array(40).fill().map(() => ({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5}));
  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="rgba(0,245,255,0.15)";
    pts.forEach(p => {
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
