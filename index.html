<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCIENCE X | OPEN LEARNING</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Heebo:wght@300;500;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00f5ff; --secondary: #7b2fff; --success: #00ff88; --danger: #ff4466;
            --bg-dark: #020610; --glass: rgba(15, 25, 45, 0.85); --border: rgba(0, 245, 255, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
        body { background: var(--bg-dark); color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        #canvas-bg { position: fixed; inset: 0; z-index: -1; }

        .app-container { width: 100%; max-width: 500px; height: 100vh; display: flex; flex-direction: column; padding: 20px; }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--glass); padding: 15px 20px; border-radius: 20px; 
            border: 1px solid var(--border); margin-bottom: 20px; backdrop-filter: blur(15px);
        }
        .brand { font-family: 'Orbitron'; font-weight: 900; color: var(--primary); letter-spacing: 2px; }

        .screen { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.4s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Menu */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; padding-bottom: 20px; }
        .btn-sector {
            background: var(--glass); border: 1px solid var(--border); padding: 20px 10px; border-radius: 15px;
            color: #fff; font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .btn-sector:hover { border-color: var(--primary); background: rgba(0, 245, 255, 0.1); transform: scale(1.03); }
        .btn-sector span { font-size: 0.7rem; opacity: 0.6; font-family: 'Orbitron'; }

        /* Quiz Card */
        .q-card { background: var(--glass); border: 1px solid var(--border); border-radius: 25px; padding: 25px; backdrop-filter: blur(20px); }
        .q-text { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; text-align: center; }
        
        .opt-btn {
            width: 100%; padding: 15px; border-radius: 12px; background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); color: #fff; text-align: right; 
            margin-bottom: 8px; cursor: pointer; transition: 0.2s;
        }
        .opt-btn.correct { background: var(--success) !important; color: #000; font-weight: 800; border-color: var(--success); }
        .opt-btn.wrong { background: var(--danger) !important; color: #fff; border-color: var(--danger); }

        /* Explanation Box */
        .explanation-box {
            margin-top: 15px; padding: 15px; background: rgba(0, 245, 255, 0.05);
            border-right: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem;
            display: none; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; height: 0; } to { opacity: 1; height: auto; } }

        .next-trigger { 
            width: 100%; padding: 18px; background: var(--primary); color: #000; 
            border: none; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; 
            margin-top: 15px; cursor: pointer; display: none; 
        }

        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="app-container">
    <header class="top-bar">
        <div class="brand">SCIENCE X</div>
        <div style="font-family:'Orbitron'; font-size:0.8rem">XP: <span id="xp-count" style="color:var(--primary)">0</span></div>
    </header>

    <main id="menu-scr" class="screen active">
        <h2 style="text-align: center; margin-bottom: 20px; font-family:'Orbitron'; color:var(--primary)">SELECT SECTOR</h2>
        <div class="menu-grid">
            <button class="btn-sector" onclick="initMission('רפואה')">רפואה <span>MEDICAL</span></button>
            <button class="btn-sector" onclick="initMission('פיזיקה')">פיזיקה <span>PHYSICS</span></button>
            <button class="btn-sector" onclick="initMission('כימיה')">כימיה <span>CHEMISTRY</span></button>
            <button class="btn-sector" onclick="initMission('אנגלית')">אנגלית <span>ENGLISH</span></button>
            <button class="btn-sector" onclick="initMission('ביולוגיה')">ביולוגיה <span>BIOLOGY</span></button>
            <button class="btn-sector" onclick="initMission('מתמטיקה')">מתמטיקה <span>MATH</span></button>
            <button class="btn-sector" onclick="initMission('מתמטיקה מתקדמת')">מתמטיקה+ <span>ADVANCED</span></button>
        </div>
    </main>

    <main id="quiz-scr" class="screen">
        <div class="progress-bar"><div id="main-bar" class="progress-fill"></div></div>
        <div id="quiz-card" class="q-card">
            <div id="q-display" class="q-text"></div>
            <div id="options-grid"></div>
            
            <div id="exp-box" class="explanation-box">
                <strong style="color:var(--primary)">הסבר:</strong> <span id="exp-text"></span>
            </div>

            <button id="btn-continue" class="next-trigger" onclick="renderNext()">המשך למשימה הבאה ➔</button>
        </div>
    </main>

    <main id="end-scr" class="screen" style="text-align: center; justify-content: center;">
        <h1 style="font-family:'Orbitron'; color:var(--success); font-size:2rem">COMPLETED</h1>
        <p id="summary-text" style="margin:20px 0"></p>
        <button class="btn-sector" style="width:100%" onclick="location.reload()">חזרה לתפריט</button>
    </main>
</div>

<script>
    const SFX = {
        correct: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
        wrong: new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3')
    };

    let DB = [], missionSet = [], currentPos = 0, xp = parseInt(localStorage.getItem('scix_xp')) || 0;

    async function initMission(cat) {
        try {
            const res = await fetch('questions.json');
            DB = await res.json();
            missionSet = DB.filter(q => q.t === cat).sort(() => Math.random() - 0.5);
            if(!missionSet.length) return alert("אין שאלות בקטגוריה זו.");
            currentPos = 0;
            switchScreen('quiz-scr');
            renderNext();
        } catch (e) { alert("שגיאה בטעינת questions.json"); }
    }

    function renderNext() {
        if(currentPos >= missionSet.length) return finish();
        const q = missionSet[currentPos];
        
        document.getElementById('q-display').innerText = q.q;
        document.getElementById('exp-box').style.display = 'none';
        document.getElementById('btn-continue').style.display = 'none';
        
        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        q.o.forEach((txt, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = txt;
            b.onclick = () => checkAnswer(i, b, q.a, q.e);
            grid.appendChild(b);
        });
        document.getElementById('main-bar').style.width = (currentPos / missionSet.length * 100) + "%";
        document.getElementById('xp-count').innerText = xp;
    }

    function checkAnswer(picked, btn, target, explanation) {
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.disabled = true);

        if(picked === target) {
            btn.classList.add('correct');
            xp += 20;
            SFX.correct.play().catch(()=>{});
            confetti({ particleCount: 40, spread: 60 });
        } else {
            btn.classList.add('wrong');
            btns[target].classList.add('correct');
            SFX.wrong.play().catch(()=>{});
        }

        // הצגת הסבר
        if(explanation) {
            document.getElementById('exp-text').innerText = explanation;
            document.getElementById('exp-box').style.display = 'block';
        }

        currentPos++;
        localStorage.setItem('scix_xp', xp);
        document.getElementById('btn-continue').style.display = 'block';
    }

    function finish() {
        switchScreen('end-scr');
        document.getElementById('summary-text').innerText = `סיימת את המשימה בהצלחה! צברת XP כולל של: ${xp}`;
        confetti({ particleCount: 150, spread: 100 });
    }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // BG Animation
    const c = document.getElementById('canvas-bg');
    const ctx = c.getContext('2d');
    function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
    resize(); window.onresize = resize;
    let dots = Array(30).fill().map(() => ({x:Math.random()*c.width, y:Math.random()*c.height, s:0.4}));
    function anim() {
        ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle = "rgba(0, 245, 255, 0.1)";
        dots.forEach(d => { d.y -= d.s; if(d.y < 0) d.y = c.height; ctx.fillRect(d.x, d.y, 2, 2); });
        requestAnimationFrame(anim);
    }
    anim();
    document.getElementById('xp-count').innerText = xp;
</script>
</body>
</html>
