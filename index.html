<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדע בכיף – תרגול מקצועות</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* כאן נשאר כל ה-CSS המקורי שלך (השמטתי לקיצור, פשוט השאר אותו כפי שהוא) */
        :root { --cyan: #00f5ff; --teal: #00d4aa; --blue: #0066ff; --purple: #7b2fff; --red: #ff4466; --green: #00ff88; --yellow: #ffcc00; --orange: #ff8800; --bg: #020810; --surface: rgba(0,245,255,0.04); --border: rgba(0,245,255,0.12); --text: #e8f4f8; --muted: #6a8fa8; }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
        #hero{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
        #particles-canvas{position:absolute;inset:0;z-index:0}
        .hero-content{position:relative;z-index:2;text-align:center;padding:2rem}
        .hero-title{font-family:'Orbitron',monospace;font-size:clamp(2.5rem,8vw,6rem);font-weight:900}
        .hero-title .line1{background:linear-gradient(135deg,#fff 0%,var(--cyan) 50%,var(--teal) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .cta-btn{display:inline-flex;padding:14px 36px;background:linear-gradient(135deg,var(--cyan),var(--blue));border-radius:50px;color:#000;text-decoration:none;font-weight:700;margin-top:20px}
        #subject-section, #quiz-section { max-width:1000px; margin:0 auto; padding:4rem 1.5rem; }
        .subjects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
        .subj-card{padding:1.4rem;border:1px solid var(--border);border-radius:18px;background:var(--surface);cursor:pointer;text-align:center;transition:0.3s}
        .subj-card:hover{border-color:var(--cyan);transform:translateY(-5px)}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2rem;position:relative}
        .opt{width:100%;padding:1rem;margin-bottom:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:white;cursor:pointer;text-align:right}
        .opt.correct{border-color:var(--green);color:var(--green);background:rgba(0,255,136,0.1)}
        .opt.wrong{border-color:var(--red);color:var(--red);background:rgba(255,68,102,0.1)}
        .feedback{margin:15px 0;padding:15px;border-radius:10px;display:none}
        .btn{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:none;color:white;cursor:pointer}
        .btn.primary{background:var(--cyan);color:black;font-weight:700}
        footer{padding:3rem;text-align:center;border-top:1px solid var(--border)}
    </style>
</head>
<body>

<section id="hero">
    <canvas id="particles-canvas"></canvas>
    <div class="hero-content">
        <h1 class="hero-title"><span class="line1">מדע בכיף</span></h1>
        <p>תרגול חכם עם שאלות מקובץ JSON חיצוני</p>
        <a href="#subject-section" class="cta-btn">התחל לתרגל</a>
    </div>
</section>

<section id="subject-section">
    <p class="section-label">// בחר מקצוע</p>
    <div class="subjects-grid" id="subjectsGrid"></div>
</section>

<section id="quiz-section" style="display:none">
    <div class="card">
        <div id="currentSubjectLabel" style="color:var(--cyan); font-weight:bold"></div>
        <div id="badgeDiff" class="badge"></div>
        <h2 id="qText" class="question">טוען שאלה...</h2>
        <div id="opts" class="options"></div>
        <div id="fb" class="feedback"></div>
        <div class="actions">
            <button class="btn primary" id="nextBtn" onclick="nextQuestion()" disabled>הבא ←</button>
            <button class="btn" onclick="goBack()">חזור</button>
        </div>
    </div>
</section>

<footer>
    <div class="footer-logo">מדע בכיף // JSON VERSION</div>
</footer>

<script>
// --- לוגיקת ניהול נתונים ---
let ALL_QUESTIONS = [];
let filteredQuestions = [];
let currentIndex = 0;
let score = 0;

// טעינת השאלות מהקובץ
async function loadQuestions() {
    try {
        const response = await fetch('question.json');
        if (!response.ok) throw new Error("לא ניתן היה לטעון את הקובץ");
        ALL_QUESTIONS = await response.json();
        renderSubjects();
    } catch (err) {
        console.error("שגיאה בטעינה:", err);
        document.getElementById('qText').innerText = "שגיאה בטעינת הקובץ. וודא שאתה מריץ את הקוד בשרת (Live Server).";
    }
}

function renderSubjects() {
    const subjects = ["הכל", ...new Set(ALL_QUESTIONS.map(q => q.t))];
    const grid = document.getElementById('subjectsGrid');
    grid.innerHTML = subjects.map(s => `
        <div class="subj-card" onclick="startQuiz('${s}')">
            <div class="subj-name">${s}</div>
        </div>
    `).join('');
}

function startQuiz(subject) {
    filteredQuestions = subject === "הכל" 
        ? ALL_QUESTIONS 
        : ALL_QUESTIONS.filter(q => q.t === subject);
    
    if (filteredQuestions.length === 0) return alert("אין שאלות בנושא זה");
    
    currentIndex = 0;
    document.getElementById('subject-section').style.display = 'none';
    document.getElementById('hero').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const q = filteredQuestions[currentIndex];
    const fb = document.getElementById('fb');
    fb.style.display = 'none';
    document.getElementById('nextBtn').disabled = true;
    
    document.getElementById('currentSubjectLabel').innerText = q.t;
    document.getElementById('qText').innerText = q.q;
    
    const optsContainer = document.getElementById('opts');
    optsContainer.innerHTML = q.o.map((opt, i) => `
        <button class="opt" onclick="checkAnswer(${i})">${opt}</button>
    `).join('');
}

function checkAnswer(index) {
    const q = filteredQuestions[currentIndex];
    const buttons = document.querySelectorAll('.opt');
    const fb = document.getElementById('fb');
    
    buttons.forEach(btn => btn.disabled = true);
    
    if (index === q.a) {
        buttons[index].classList.add('correct');
        fb.innerHTML = `<strong>נכון מאוד!</strong> ${q.e || ""}`;
        fb.style.background = "rgba(0, 255, 136, 0.1)";
    } else {
        buttons[index].classList.add('wrong');
        buttons[q.a].classList.add('correct');
        fb.innerHTML = `<strong>טעות.</strong> ${q.e || ""}`;
        fb.style.background = "rgba(255, 68, 102, 0.1)";
    }
    
    fb.style.display = 'block';
    document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < filteredQuestions.length) {
        showQuestion();
    } else {
        alert("סיימת את כל השאלות!");
        goBack();
    }
}

function goBack() {
    document.getElementById('subject-section').style.display = 'block';
    document.getElementById('hero').style.display = 'flex';
    document.getElementById('quiz-section').style.display = 'none';
}

// הפעלה ראשונית
loadQuestions();

// אנימציית רקע (חלקיקים) - הושאר מהקוד המקורי שלך
(function(){
    const canvas=document.getElementById('particles-canvas');
    const ctx=canvas.getContext('2d');
    let W,H;
    function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
    window.onresize=resize; resize();
    function animate(){
        ctx.clearRect(0,0,W,H);
        requestAnimationFrame(animate);
    }
    animate();
})();
</script>

</body>
</html>
