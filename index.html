<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדע בכיף – הכל רמה הבאה</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --cyan: #00f5ff; --teal: #00d4aa; --blue: #0066ff; --purple: #7b2fff;
            --red: #ff4466; --green: #00ff88; --yellow: #ffcc00; --bg: #020810;
            --surface: rgba(0,245,255,0.04); --border: rgba(0,245,255,0.15);
            --text: #e8f4f8; --muted: #6a8fa8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* ─── BACKGROUND PARTICLES ─── */
        #particles-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* ─── HERO SECTION ─── */
        #hero {
            position: relative; height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; z-index: 2;
        }
        .hero-title {
            font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900; letter-spacing: -2px; margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--cyan) 50%, var(--blue) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .cta-btn {
            padding: 18px 45px; background: linear-gradient(135deg, var(--cyan), var(--blue));
            border: none; border-radius: 50px; font-family: 'Orbitron'; font-weight: 700;
            color: #000; cursor: pointer; transition: 0.3s; box-shadow: 0 0 30px rgba(0,245,255,0.4);
        }
        .cta-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px var(--cyan); }

        /* ─── QUIZ INTERFACE ─── */
        #quiz-section {
            max-width: 800px; margin: 2rem auto; padding: 2rem; display: none;
            position: relative; z-index: 10;
        }
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); padding: 15px; border-radius: 15px;
            border: 1px solid var(--border); backdrop-filter: blur(10px); margin-bottom: 1.5rem;
        }
        .streak { color: var(--yellow); font-family: 'Orbitron'; font-weight: bold; font-size: 14px; }

        .xp-container { margin-bottom: 2rem; }
        .xp-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
        .xp-track { height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); width: 0%; transition: 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 25px;
            padding: 2.5rem; backdrop-filter: blur(15px); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .category-tag { font-family: 'Orbitron'; color: var(--cyan); font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; }
        .question { font-size: 24px; font-weight: 500; margin-bottom: 2rem; line-height: 1.4; }

        .options { display: grid; gap: 12px; }
        .opt {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 16px; border-radius: 12px; color: var(--text); font-size: 16px;
            text-align: right; cursor: pointer; transition: 0.2s; position: relative;
        }
        .opt:hover:not(:disabled) { border-color: var(--cyan); background: rgba(0,245,255,0.08); transform: translateX(-5px); }
        .opt.correct { background: rgba(0,255,136,0.2) !important; border-color: var(--green) !important; color: var(--green); }
        .opt.wrong { background: rgba(255,68,102,0.2) !important; border-color: var(--red) !important; color: var(--red); }

        .next-btn {
            width: 100%; margin-top: 2rem; padding: 15px; border-radius: 12px;
            background: var(--cyan); color: #000; font-family: 'Orbitron';
            font-weight: 900; border: none; cursor: pointer; display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <section id="hero">
        <h1 class="hero-title">מדע בכיף</h1>
        <p style="color:var(--muted); margin-bottom:2rem; font-size:1.2rem;">KNOWLEDGE NEXT LEVEL</p>
        <button class="cta-btn" onclick="initQuiz()">התחל תרגול</button>
    </section>

    <section id="quiz-section">
        <div class="topbar">
            <div class="streak" id="streakLabel">🔥 STREAK: 0</div>
            <div style="font-family:'Orbitron'; font-size:12px; color:var(--muted);">PROGRESS: <span id="percentText" style="color:var(--cyan)">0%</span></div>
        </div>

        <div class="xp-container">
            <div class="xp-label"><span>LEVEL 1</span><span id="qCount">0/400 השלמת</span></div>
            <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
        </div>

        <div class="card">
            <div class="category-tag" id="catLabel">CATEGORY</div>
            <div class="question" id="qText">טוען נתונים מהמערכת...</div>
            <div class="options" id="opts"></div>
            <button class="next-btn" id="nextBtn" onclick="renderQuestion()">השאלה הבאה ➔</button>
        </div>
    </section>

    <script>
        // ─── נתונים (DATABASE) ───
        const db = [
            {t:"ביולוגיה", q:"מה הוא ה'תחנת הכוח' של התא?", o:["גרעין","מיטוכונדריה","ריבוזום","ממברנה"], a:1},
            {t:"כימיה", q:"מהי הנוסחה הכימית של מים?", o:["H2O","CO2","NaCl","O2"], a:0},
            {t:"פיזיקה", q:"מהו המרכיב העיקרי בסיבי פחמן (Carbon Fiber)?", o:["פלסטיק","פחמן","ברזל","זכוכית"], a:1},
            {t:"ביולוגיה", q:"כמה לבבות יש לאדם?", o:["2","1","3","4"], a:1},
            // תוסיף כאן את כל השאלות שלך באותו מבנה...
        ];

        // ─── סאונדים ───
        const sfxCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
        const sfxWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');

        let answered = JSON.parse(localStorage.getItem('maor_quiz_progress')) || [];

        function initQuiz() {
            document.getElementById('hero').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateStreak();
            renderQuestion();
        }

        function updateStreak() {
            const today = new Date().toDateString();
            const last = localStorage.getItem('maor_last_date');
            let streak = parseInt(localStorage.getItem('maor_streak')) || 0;

            if (last !== today) {
                if (last === new Date(Date.now() - 86400000).toDateString()) streak++;
                else streak = 1;
                localStorage.setItem('maor_streak', streak);
                localStorage.setItem('maor_last_date', today);
            }
            document.getElementById('streakLabel').innerText = `🔥 STREAK: ${streak}`;
        }

        function renderQuestion() {
            let nextIdx = 0;
            while(answered.includes(nextIdx) && answered.length < db.length) nextIdx++;

            if (answered.length >= db.length) {
                document.getElementById('qText').innerText = "כל הכבוד! סיימת את כל המאגר! 🏆";
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                return;
            }

            const q = db[nextIdx];
            document.getElementById('catLabel').innerText = q.t;
            document.getElementById('qText').innerText = q.q;
            document.getElementById('nextBtn').style.display = 'none';
            
            const optsBox = document.getElementById('opts');
            optsBox.innerHTML = '';
            
            q.o.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'opt';
                b.innerText = opt;
                b.onclick = () => checkAns(i, b, nextIdx);
                optsBox.appendChild(b);
            });
            updateUI();
        }

        function checkAns(idx, btn, qIdx) {
            const q = db[qIdx];
            const btns = document.querySelectorAll('.opt');
            btns.forEach(b => b.disabled = true);

            if (idx === q.a) {
                btn.classList.add('correct');
                sfxCorrect.play();
                confetti({ particleCount: 40, spread: 50, colors: ['#00f5ff', '#00ff88'] });
                if (!answered.includes(qIdx)) {
                    answered.push(qIdx);
                    localStorage.setItem('maor_quiz_progress', JSON.stringify(answered));
                }
            } else {
                btn.classList.add('wrong');
                btns[q.a].classList.add('correct');
                sfxWrong.play();
            }
            document.getElementById('nextBtn').style.display = 'block';
        }

        function updateUI() {
            const pct = (answered.length / db.length) * 100;
            document.getElementById('xpFill').style.width = pct + "%";
            document.getElementById('percentText').innerText = Math.floor(pct) + "%";
            document.getElementById('qCount').innerText = `${answered.length}/${db.length} הושלמו`;
        }

        // ─── PARTICLES CORE ───
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize;
        resize();

        for(let i=0; i<80; i++) pts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4});

        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            pts.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>canvas.width) p.vx *= -1;
                if(p.y<0 || p.y>canvas.height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fillStyle = "rgba(0, 245, 255, 0.3)"; ctx.fill();
                
                for(let j=i+1; j<pts.length; j++) {
                    let p2 = pts[j];
                    let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(d < 120) {
                        ctx.beginPath(); ctx.strokeStyle = `rgba(0, 245, 255, ${1 - d/120})`;
                        ctx.lineWidth = 0.5; ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(anim);
        }
        anim();
    </script>
</body>
</html>
