<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCIENCE X | THE COMPLETE EDITION</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --cyan: #00f5ff; --teal: #00d4aa; --blue: #0066ff; --purple: #7b2fff;
  --red: #ff4466; --green: #00ff88; --yellow: #ffcc00; --orange: #ff8800;
  --bg: #020810; --surface: rgba(0,245,255,0.04); --border: rgba(0,245,255,0.12);
  --text: #e8f4f8; --muted: #6a8fa8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

/* ─── PARTICLES & HERO ─── */
#particles-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#hero{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.hero-title { font-family:'Orbitron'; font-size:clamp(2.5rem,8vw,5rem); font-weight:900; text-align:center; margin-bottom:1rem; background:linear-gradient(135deg,#fff,var(--cyan)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

/* ─── SUBJECT CARDS (SPECIFIC COLORS) ─── */
#subject-section{position:relative; max-width:1000px; margin:0 auto; padding:4rem 1.5rem; z-index:2}
.subjects-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
.subj-card{
  padding:1.4rem; border:1px solid var(--border); border-radius:18px;
  background:var(--surface); cursor:pointer; text-align:center;
  transition:all .25s; backdrop-filter:blur(10px);
}
.subj-card:hover{transform:translateY(-5px); box-shadow:0 8px 30px rgba(0,245,255,0.15)}
.subj-card[data-subj="ביולוגיה"]:hover{border-color:var(--green); color:var(--green)}
.subj-card[data-subj="כימיה"]:hover{border-color:var(--orange); color:var(--orange)}
.subj-card[data-subj="פיזיקה"]:hover{border-color:var(--purple); color:var(--purple)}
.subj-card[data-subj="רפואה"]:hover{border-color:var(--red); color:var(--red)}

/* ─── GAME HUD ─── */
#quiz-section{max-width:820px; margin:0 auto; padding:2rem 1.5rem; display:none; position:relative; z-index:2}
.topbar{display:flex; justify-content:space-between; align-items:center; padding:.75rem 1.2rem; background:var(--surface); border-radius:14px; border:1px solid var(--border); margin-bottom:1rem; backdrop-filter:blur(10px)}
.stats-group{display:flex; gap:15px; font-family:'Orbitron'; font-size:12px;}
.stat span{color:var(--cyan); font-weight:bold}
.lives{color:var(--red); font-size:1.2rem; letter-spacing:3px}

.xp-bar-wrap{margin-bottom:1rem}
.xp-track{height:6px; background:rgba(255,255,255,0.05); border-radius:99px; overflow:hidden; border:1px solid var(--border)}
.xp-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--teal),var(--cyan)); transition:width .5s ease}

/* ─── QUIZ CARD ─── */
.card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2rem; backdrop-filter:blur(12px); position:relative}
.streak-fire{font-size:2.5rem; text-align:center; display:none; animation:pulse 0.5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}

.badge{display:inline-block; font-size:10px; padding:4px 12px; border-radius:99px; background:rgba(0,245,255,0.1); color:var(--cyan); font-family:'Orbitron'; margin-bottom:1rem}
.options{display:grid; gap:10px}
.opt{width:100%; padding:1rem; text-align:right; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,0.02); color:#fff; cursor:pointer; transition:0.2s}
.opt:hover:not(:disabled){border-color:var(--cyan); background:rgba(0,245,255,0.05)}
.opt.correct{background:var(--green)!important; color:#000; font-weight:bold}
.opt.wrong{background:var(--red)!important}

/* ─── MODAL ─── */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; display:none; align-items:center; justify-content:center; padding:1rem; backdrop-filter:blur(8px)}
.modal-box{background:#060f1a; border:1px solid var(--red); border-radius:24px; padding:2rem; max-width:450px; text-align:center}

.btn{padding:10px 20px; border-radius:10px; border:1px solid var(--border); background:transparent; color:#fff; cursor:pointer; font-family:'Orbitron'}
.btn-primary{background:var(--cyan); color:#000; border:none}
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<section id="hero">
    <h1 class="hero-title">SCIENCE X</h1>
    <p style="color:var(--muted); letter-spacing:5px">KNOWLEDGE BATTLEGROUND</p>
    <a href="#subject-section" class="btn btn-primary" style="margin-top:2rem; text-decoration:none">התחל לתרגל</a>
</section>

<section id="subject-section">
    <div class="subjects-grid">
        <div class="subj-card" data-subj="ביולוגיה" onclick="checkMed('ביולוגיה')">🧬<br>ביולוגיה</div>
        <div class="subj-card" data-subj="כימיה" onclick="checkMed('כימיה')">🧪<br>כימיה</div>
        <div class="subj-card" data-subj="פיזיקה" onclick="checkMed('פיזיקה')">⚡<br>פיזיקה</div>
        <div class="subj-card" data-subj="מתמטיקה" onclick="checkMed('מתמטיקה')">📐<br>מתמטיקה</div>
        <div class="subj-card" data-subj="אנגלית" onclick="checkMed('אנגלית')">🌍<br>אנגלית</div>
        <div class="subj-card" data-subj="רפואה" onclick="checkMed('רפואה')">⚕️<br>רפואה</div>
    </div>
</section>

<section id="quiz-section">
    <div class="topbar">
        <div class="stats-group">
            <div class="stat">רמה: 
                <select id="lvlSel" onchange="changeLvl()" style="background:none; color:var(--cyan); border:none">
                    <option value="1">קל</option><option value="2">בינוני</option>
                    <option value="3">קשה</option><option value="4">מומחה</option>
                </select>
            </div>
            <div class="stat">נכון: <span id="correctCnt">0</span></div>
            <div class="stat">שגוי: <span id="wrongCnt">0</span></div>
        </div>
        <div class="lives" id="lives-hud">❤️❤️❤️</div>
    </div>

    <div class="xp-bar-wrap">
        <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
    </div>

    <div class="card">
        <div id="fire-icon" class="streak-fire">🔥 <span id="streak-num">0</span></div>
        <div id="badge-lvl" class="badge">LEVEL 1</div>
        <div id="q-text" class="q-text" style="font-size:1.4rem; margin-bottom:1.5rem"></div>
        <div id="opts-box" class="options"></div>
        <div id="feedback" style="margin-top:1rem; color:var(--teal); display:none; padding:1rem; background:rgba(0,245,255,0.05); border-radius:10px"></div>
        
        <div style="display:flex; gap:10px; margin-top:1.5rem">
            <button id="next-btn" class="btn btn-primary" onclick="nextQ()" style="display:none">השאלה הבאה</button>
            <button id="exp-btn" class="btn" onclick="showExp()" disabled>💡 הסבר</button>
            <button class="btn" onclick="location.reload()">חזור</button>
        </div>
    </div>
</section>

<div class="modal-overlay" id="medModal">
    <div class="modal-box">
        <h2 style="color:var(--red); font-family:'Orbitron'; margin-bottom:1rem">אזהרה רפואית</h2>
        <p>המידע כאן הוא למטרות לימודיות בלבד. אין להשתמש בו במצבי אמת ללא הכשרה.</p>
        <button class="btn btn-primary" style="margin-top:1.5rem" onclick="confirmMed()">אני מאשר/ת</button>
    </div>
</div>

<script>
// ─── DATA (דוגמה קטנה, המערכת תומכת ב-ALL המלא שלך) ───
const QUESTIONS = window.ALL || [
    {l:1, t:"ביולוגיה", q:"מהו 'תחנת הכוח' של התא?", o:["גרעין","מיטוכונדריה","ריבוזום","ממברנה"], a:1, e:"מיטוכונדריה מייצרת ATP."},
    {l:1, t:"רפואה", q:"מהו דופק תקין במנוחה למבוגר?", o:["40-60","60-100","100-120","120-140"], a:1, e:"דופק תקין נע בין 60 ל-100 פעימות לדקה."}
];

let curCat = "", curLvl = 1, curIdx = 0, lives = 3, streak = 0, xp = 0, correct = 0, wrong = 0;
let filtered = [];

function checkMed(cat) {
    curCat = cat;
    if(cat === 'רפואה') document.getElementById('medModal').style.display = 'flex';
    else startQuiz();
}

function confirmMed() {
    document.getElementById('medModal').style.display = 'none';
    startQuiz();
}

function startQuiz() {
    document.getElementById('hero').style.display = 'none';
    document.getElementById('subject-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    changeLvl();
}

function changeLvl() {
    curLvl = parseInt(document.getElementById('lvlSel').value);
    filtered = QUESTIONS.filter(q => q.t === curCat && q.l === curLvl).sort(() => Math.random() - 0.5);
    curIdx = 0;
    renderQ();
}

function renderQ() {
    if(curIdx >= filtered.length) { alert("סיימת את השלב!"); location.reload(); return; }
    const q = filtered[curIdx];
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('badge-lvl').innerText = `LEVEL ${q.l} | ${curCat}`;
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('exp-btn').disabled = true;
    document.getElementById('fire-icon').style.display = streak >= 3 ? 'block' : 'none';
    document.getElementById('streak-num').innerText = streak;

    const box = document.getElementById('opts-box');
    box.innerHTML = '';
    q.o.forEach((opt, i) => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerText = opt;
        b.onclick = () => checkAns(i, b, q.a);
        box.appendChild(b);
    });
}

function checkAns(i, btn, ans) {
    const btns = document.querySelectorAll('.opt');
    btns.forEach(b => b.disabled = true);
    document.getElementById('exp-btn').disabled = false;

    if(i === ans) {
        btn.classList.add('correct');
        correct++; streak++; xp += 20;
        confetti({particleCount:50, spread:60});
    } else {
        btn.classList.add('wrong');
        btns[ans].classList.add('correct');
        wrong++; streak = 0; lives--;
        updateLives();
    }
    document.getElementById('correctCnt').innerText = correct;
    document.getElementById('wrongCnt').innerText = wrong;
    document.getElementById('xpFill').style.width = (xp % 100) + "%";
    document.getElementById('next-btn').style.display = 'inline-block';
}

function updateLives() {
    document.getElementById('lives-hud').innerText = "❤️".repeat(lives);
    if(lives <= 0) { alert("Game Over!"); location.reload(); }
}

function showExp() {
    const q = filtered[curIdx];
    const f = document.getElementById('feedback');
    f.innerText = q.e;
    f.style.display = 'block';
}

function nextQ() { curIdx++; renderQ(); }

// ─── PRO PARTICLES (Full Logic) ───
(function(){
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, pts = [], mouse = {x:-9999, y:-9999};
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    for(let i=0; i<80; i++) pts.push({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-0.5), vy:(Math.random()-0.5)});
    function anim() {
        ctx.clearRect(0,0,W,H);
        pts.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
            ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fillStyle = "rgba(0,245,255,0.5)"; ctx.fill();
            pts.forEach(p2 => {
                let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                if(d < 100) {
                    ctx.strokeStyle = `rgba(0,245,255,${1 - d/100})`;
                    ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
            });
        });
        requestAnimationFrame(anim);
    }
    anim();
})();
</script>
</body>
</html>
