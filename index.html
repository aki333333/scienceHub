<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Hub - המאגר המלא</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f5ff; --teal: #00d4aa; --blue: #0066ff;
            --purple: #7b2fff; --red: #ff4466; --green: #00ff88;
            --yellow: #ffcc00; --bg: #020810;
            --surface: rgba(0,245,255,0.04); --border: rgba(0,245,255,0.12);
            --text: #e8f4f8; --muted: #6a8fa8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* ─── HERO & CANVAS (העיצוב המקורי) ─── */
        #hero { position: relative; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #particles-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
        .hero-content { position: relative; z-index: 2; text-align: center; padding: 2rem; pointer-events: none; }
        .hero-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; background: linear-gradient(135deg, #fff, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .cta-btn { pointer-events: auto; margin-top: 2rem; display: inline-flex; padding: 14px 36px; background: linear-gradient(135deg, var(--cyan), var(--blue)); border-radius: 50px; font-family: 'Orbitron', sans-serif; font-weight: 700; color: #000; cursor: pointer; text-decoration: none; box-shadow: 0 0 30px rgba(0,245,255,0.3); transition: 0.3s; border: none; }
        .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 0 50px rgba(0,245,255,0.5); }

        /* ─── SUBJECTS GRID ─── */
        #subject-section { max-width: 1100px; margin: 0 auto; padding: 4rem 1.5rem; position: relative; z-index: 5; }
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .subj-card { background: var(--surface); border: 1px solid var(--border); padding: 2rem; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; backdrop-filter: blur(10px); }
        .subj-card:hover { border-color: var(--cyan); transform: translateY(-5px); background: rgba(0,245,255,0.08); }
        .subj-icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .subj-name { font-family: 'Orbitron', sans-serif; color: var(--cyan); font-weight: 700; }

        /* ─── QUIZ AREA ─── */
        #quiz-section { max-width: 800px; margin: 2rem auto; padding: 1.5rem; display: none; position: relative; z-index: 10; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 2.5rem; backdrop-filter: blur(15px); }
        .question { font-size: 1.4rem; margin-bottom: 2rem; line-height: 1.6; text-align: right; }
        .opt { width: 100%; padding: 1rem; margin-bottom: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; color: #fff; cursor: pointer; text-align: right; transition: 0.2s; font-size: 1.1rem; }
        .opt:hover:not(:disabled) { background: rgba(0,245,255,0.1); border-color: var(--cyan); }
        .opt.correct { background: rgba(0,255,136,0.15); border-color: var(--green); color: var(--green); }
        .opt.wrong { background: rgba(255,68,102,0.15); border-color: var(--red); color: var(--red); }
        
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 1.5rem; background: var(--surface); padding: 1rem; border-radius: 15px; border: 1px solid var(--border); font-family: 'Orbitron', sans-serif; }
        .feedback { margin-top: 1.5rem; padding: 1rem; border-radius: 12px; display: none; line-height: 1.6; text-align: right; border-right: 4px solid var(--cyan); }
    </style>
</head>
<body>

<section id="hero">
    <canvas id="particles-canvas"></canvas>
    <div class="hero-content">
        <h1 class="hero-title">SCIENCE HUB</h1>
        <p style="color: var(--muted); margin-top: 10px; letter-spacing: 2px;">ADVANCED KNOWLEDGE SYSTEM</p>
        <button class="cta-btn" onclick="document.getElementById('subject-section').scrollIntoView({behavior:'smooth'})">גלה את המאגר</button>
    </div>
</section>

<section id="subject-section">
    <h2 style="margin-bottom: 30px; font-family: 'Orbitron'; color: var(--cyan);">// SELECT_SUBJECT</h2>
    <div class="subjects-grid" id="subjectsGrid">
        </div>
</section>

<section id="quiz-section">
    <div class="stats-bar">
        <div>נכון: <span id="correct" style="color:var(--green)">0</span></div>
        <div>שגוי: <span id="wrong" style="color:var(--red)">0</span></div>
        <div>XP: <span id="xpNum" style="color:var(--cyan)">0</span></div>
    </div>
    <div class="card">
        <div id="qText" class="question">טוען שאלה...</div>
        <div id="opts"></div>
        <div id="fb" class="feedback"></div>
        <button class="cta-btn" id="nextBtn" onclick="next()" style="display:none; width:100%; justify-content: center;">שאלה הבאה ←</button>
        <button class="opt" onclick="goBack()" style="margin-top:20px; opacity:0.5; border:none; background:none;">חזור לתפריט</button>
    </div>
</section>

<script>
// ─── 1. PARTICLES ENGINE (המקורי שלך - עם הקווים) ───
const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function initCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 1.2;
        this.speedY = (Math.random() - 0.5) * 1.2;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
        if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
    }
    draw() {
        ctx.fillStyle = 'rgba(0, 245, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function handleParticles() {
    for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
                ctx.strokeStyle = `rgba(0, 245, 255, ${0.15 * (1 - distance/150)})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    handleParticles();
    requestAnimationFrame(animate);
}

window.addEventListener('resize', initCanvas);
initCanvas();
for (let i = 0; i < 90; i++) particles.push(new Particle());
animate();

// ─── 2. QUIZ CORE (JSON + ALL QUESTIONS) ───
let ALL_QUESTIONS = [];
let filteredQuestions = [];
let currentIndex = 0;
let stats = { c: 0, w: 0, xp: 0 };

async function loadData() {
    try {
        const response = await fetch('questions.json');
        if (!response.ok) throw new Error("קובץ JSON לא נמצא");
        ALL_QUESTIONS = await response.json();
        renderMenu();
    } catch (err) {
        console.error("שגיאה בטעינה:", err);
        document.getElementById('subjectsGrid').innerHTML = "<p style='color:var(--red)'>שגיאה בטעינת המאגר. בדוק את קובץ ה-JSON.</p>";
    }
}

function renderMenu() {
    const grid = document.getElementById('subjectsGrid');
    grid.innerHTML = "";
    
    // כפתור "הכל" - תמיד ראשון
    const allBtn = document.createElement('div');
    allBtn.className = 'subj-card';
    allBtn.onclick = () => startQuiz("הכל");
    allBtn.innerHTML = `<div class="subj-icon">🚀</div><div class="subj-name">הכל</div>`;
    grid.appendChild(allBtn);

    // חילוץ מקצועות ייחודיים
    const subjects = [...new Set(ALL_QUESTIONS.map(q => q.t))];
    subjects.forEach(s => {
        const div = document.createElement('div');
        div.className = 'subj-card';
        div.onclick = () => startQuiz(s);
        let icon = "🔬";
        if(s.includes("רפואה")) icon = "⚕️";
        if(s.includes("פיזיקה")) icon = "🌌";
        if(s.includes("כימיה")) icon = "🧪";
        div.innerHTML = `<div class="subj-icon">${icon}</div><div class="subj-name">${s}</div>`;
        grid.appendChild(div);
    });
}

function startQuiz(subject) {
    if (subject === "הכל") {
        filteredQuestions = [...ALL_QUESTIONS];
    } else {
        filteredQuestions = ALL_QUESTIONS.filter(q => q.t === subject);
    }

    filteredQuestions.sort(() => Math.random() - 0.5);
    currentIndex = 0;
    
    document.getElementById('subject-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const q = filteredQuestions[currentIndex];
    document.getElementById('qText').innerText = q.q;
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('fb').style.display = 'none';
    
    const optsDiv = document.getElementById('opts');
    optsDiv.innerHTML = "";
    
    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i);
        optsDiv.appendChild(btn);
    });
}

function checkAnswer(idx) {
    const q = filteredQuestions[currentIndex];
    const btns = document.querySelectorAll('.opt');
    btns.forEach(b => b.disabled = true);
    
    const fb = document.getElementById('fb');
    fb.style.display = 'block';
    
    if (idx === q.a) {
        btns[idx].classList.add('correct');
        fb.innerHTML = `<b style="color:var(--green)">נכון מאוד!</b><br>${q.e}`;
        stats.c++;
        stats.xp += 15;
    } else {
        btns[idx].classList.add('wrong');
        btns[q.a].classList.add('correct');
        fb.innerHTML = `<b style="color:var(--red)">טעות.</b><br>${q.e}`;
        stats.w++;
    }
    
    document.getElementById('correct').innerText = stats.c;
    document.getElementById('wrong').innerText = stats.w;
    document.getElementById('xpNum').innerText = stats.xp;
    document.getElementById('nextBtn').style.display = 'flex';
}

function next() {
    currentIndex++;
    if (currentIndex < filteredQuestions.length) {
        showQuestion();
    } else {
        alert("סיימת את השאלות במאגר זה!");
        goBack();
    }
}

function goBack() {
    document.getElementById('subject-section').style.display = 'block';
    document.getElementById('quiz-section').style.display = 'none';
}

loadData();
</script>

</body>
</html>
