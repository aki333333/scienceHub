<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCIENCE X | PRO EDITION</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #00f5ff; --teal: #00d4aa; --red: #ff4466; --green: #00ff88; --bg: #020810;
  --border: rgba(0,245,255,0.15); --yellow: #ffcc00; --orange: #ff6600;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:#e8f4f8;overflow-x:hidden;min-height:100vh;}

#particles-canvas{position:fixed;inset:0;z-index:-1; pointer-events: none;}
.container { max-width: 750px; margin: 0 auto; padding: 20px; text-align: center; }

/* ─── HUD & XP BAR ─── */
#quiz-screen { display: none; }
.hud-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-family: 'Orbitron'; }
.lives { color: var(--red); font-size: 1.4rem; letter-spacing: 5px; }

.xp-container { width: 100%; margin-bottom: 20px; }
.xp-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--cyan); margin-bottom: 5px; font-family: 'Orbitron'; }
.xp-bar { height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
#xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal), var(--cyan)); transition: width 0.5s ease; box-shadow: 0 0 10px var(--cyan); }

.timer-bar { width: 100%; height: 4px; background: rgba(255,68,102,0.2); margin-bottom: 15px; }
#timer-fill { height: 100%; width: 100%; background: var(--red); transition: width 0.1s linear; }

/* ─── CARD ─── */
.card { background: rgba(7, 15, 30, 0.95); border: 1px solid var(--border); border-radius: 30px; padding: 30px; position: relative; backdrop-filter: blur(15px); }
.badge { display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 10px; font-family: 'Orbitron'; margin-bottom: 15px; border: 1px solid var(--cyan); color: var(--cyan); }

.streak-fire { font-size: 2rem; margin-bottom: 10px; display: none; animation: flicker 0.5s infinite alternate; }
@keyframes flicker { from { transform: scale(1); } to { transform: scale(1.15); } }

.q-text { font-size: 1.5rem; font-weight: 800; margin-bottom: 25px; }
.options { display: grid; gap: 10px; }
.opt {
    width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.03); color: #fff; cursor: pointer; text-align: right; transition: 0.2s;
}
.opt.correct { background: var(--green) !important; color: #000; font-weight: 900; }
.opt.wrong { background: var(--red) !important; }

/* ─── FEEDBACK & ACTIONS ─── */
#feedback-box { 
    margin-top: 15px; padding: 15px; border-radius: 12px; font-size: 14px; 
    background: rgba(0,245,255,0.05); border: 1px solid var(--cyan); color: var(--cyan); display: none; 
}

.actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; padding: 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 800; font-family: 'Orbitron'; transition: 0.2s; }
.btn-primary { background: var(--cyan); color: #000; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: #fff; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ─── MENU ─── */
.hero-title { font-family:'Orbitron'; font-size: 3.5rem; color: var(--cyan); margin-bottom: 30px; }
.subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
.btn-cat { background: rgba(0,245,255,0.05); border: 1px solid var(--border); padding: 25px; border-radius: 20px; color: #fff; cursor: pointer; }
.btn-cat:hover { border-color: var(--cyan); background: rgba(0,245,255,0.1); }
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="container">
    <div id="menu-screen">
        <h1 class="hero-title">SCIENCE X</h1>
        <div class="subjects-grid">
            <button class="btn-cat" onclick="start('ביולוגיה')">🧬<br>BIOLOGY</button>
            <button class="btn-cat" onclick="start('כימיה')">🧪<br>CHEMISTRY</button>
            <button class="btn-cat" onclick="start('פיזיקה')">⚡<br>PHYSICS</button>
            <button class="btn-cat" onclick="start('מתמטיקה')">📐<br>MATH</button>
            <button class="btn-cat" onclick="start('רפואה')">⚕️<br>MEDICAL</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div class="hud-top">
            <button class="btn-outline" style="padding: 5px 15px; font-size: 10px;" onclick="location.reload()">⬅ BACK</button>
            <div id="lives-display" class="lives">❤️❤️❤️</div>
        </div>

        <div class="xp-container">
            <div class="xp-info"><span>XP PROGRESS</span><span id="xp-text">0 / 500</span></div>
            <div class="xp-bar"><div id="xp-fill"></div></div>
        </div>

        <div class="timer-bar"><div id="timer-fill"></div></div>
        
        <div class="card">
            <div id="fire-icon" class="streak-fire">🔥 <span id="streak-num">0</span></div>
            <div id="diff-badge" class="badge">LEVEL 1</div>
            <div id="q-text" class="q-text"></div>
            <div id="options-box" class="options"></div>
            
            <div id="feedback-box"></div>

            <div class="actions">
                <button id="explain-btn" class="btn btn-outline" onclick="showExplain()" disabled>💡 EXPLAIN</button>
                <button id="next-btn" class="btn btn-primary" onclick="renderNext()" style="display:none">NEXT MISSION ➔</button>
            </div>
        </div>
    </div>
</div>

<script src="questions.js"></script>

<script>
let missionSet = [], cur = 0, xp = 0, lives = 3, streak = 0, timerInterval, timeLeft;
const XP_GOAL = 500;

function start(cat) {
    const data = window.ALL || window.questions;
    missionSet = data.filter(q => q.t === cat).sort(() => Math.random() - 0.5);
    cur = 0; xp = 0; lives = 3; streak = 0;
    updateHUD();
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    renderNext();
}

function updateHUD() {
    document.getElementById('lives-display').innerText = "❤️".repeat(lives);
    document.getElementById('xp-text').innerText = `${xp} / ${XP_GOAL}`;
    document.getElementById('xp-fill').style.width = Math.min((xp / XP_GOAL) * 100, 100) + "%";
    if(lives <= 0) { alert("המשימה נכשלה! נסה שוב."); location.reload(); }
}

function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 15;
    const bar = document.getElementById('timer-fill');
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        bar.style.width = (timeLeft / 15) * 100 + "%";
        if(timeLeft <= 0) { clearInterval(timerInterval); handleWrong(); }
    }, 100);
}

function renderNext() {
    if(cur >= missionSet.length) { alert("אלוף! סיימת הכל!"); location.reload(); return; }
    
    clearInterval(timerInterval);
    startTimer();
    
    const q = missionSet[cur];
    document.getElementById('fire-icon').style.display = (streak >= 3) ? 'block' : 'none';
    document.getElementById('streak-num').innerText = streak;
    document.getElementById('diff-badge').innerText = "LEVEL " + (q.l || 1);
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('feedback-box').style.display = 'none';
    document.getElementById('explain-btn').disabled = true;
    document.getElementById('next-btn').style.display = 'none';
    
    const box = document.getElementById('options-box');
    box.innerHTML = '';
    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerText = opt;
        btn.onclick = () => check(i, btn, q.a);
        box.appendChild(btn);
    });
}

function check(idx, btn, ans) {
    clearInterval(timerInterval);
    const btns = document.querySelectorAll('.opt');
    btns.forEach(b => b.disabled = true);
    document.getElementById('explain-btn').disabled = false;

    if(idx === ans) {
        btn.classList.add('correct');
        streak++;
        xp += (25 + streak * 5);
        confetti({ particleCount: 40, spread: 60 });
    } else {
        btn.classList.add('wrong');
        btns[ans].classList.add('correct');
        handleWrong();
    }
    cur++;
    updateHUD();
    document.getElementById('next-btn').style.display = 'block';
}

function handleWrong() {
    lives--;
    streak = 0;
    updateHUD();
    document.body.style.backgroundColor = "#200";
    setTimeout(() => document.body.style.backgroundColor = var(--bg), 200);
}

function showExplain() {
    const q = missionSet[cur-1];
    const fb = document.getElementById('feedback-box');
    fb.innerText = q.e || "אין הסבר זמין לשאלה זו.";
    fb.style.display = 'block';
}

// רקע חלקיקים
(function(){
  const canvas=document.getElementById('particles-canvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function res(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  window.onresize=res; res();
  function d(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="rgba(0,245,255,0.15)";
    for(i=0;i<30;i++){ ctx.beginPath(); ctx.arc(Math.random()*W,Math.random()*H,1,0,7); ctx.fill();}
    setTimeout(d, 150);
  }
  d();
})();
</script>
</body>
</html>
