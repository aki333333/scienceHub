<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדע בכיף - Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cyan: #00f5ff; --blue: #0066ff; --purple: #7b2fff; --green: #00ff88; --red: #ff4466;
            --bg: #020810; --card: rgba(255,255,255,0.03); --border: rgba(0,245,255,0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Heebo', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }

        #bg-canvas { position: fixed; inset: 0; z-index: -1; }

        .container { max-width: 850px; margin: 0 auto; padding: 20px; min-height: 100vh; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; backdrop-filter: blur(10px); }
        .logo { font-family: 'Orbitron'; font-weight: 900; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        
        /* אזהרה רפואית */
        .medical-warning { 
            background: rgba(255, 68, 102, 0.1); border: 1px solid var(--red); 
            padding: 10px; border-radius: 10px; color: var(--red); 
            font-size: 12px; text-align: center; margin-bottom: 15px; display: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% {opacity: 1} 50% {opacity: 0.6} 100% {opacity: 1} }

        /* מסך בחירה */
        #menu-screen { text-align: center; animation: fadeIn 0.5s; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
        .filter-btn {
            background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px;
            color: #fff; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .filter-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan); }
        .filter-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

        .start-btn {
            width: 100%; padding: 20px; border-radius: 50px; border: none; font-family: 'Orbitron';
            background: linear-gradient(90deg, var(--blue), var(--purple)); color: #fff; font-size: 18px;
            font-weight: 900; cursor: pointer; margin-top: 20px;
        }

        /* מסך קוויז */
        #quiz-screen, #level-up-screen { display: none; animation: fadeIn 0.5s; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 25px; padding: 30px; backdrop-filter: blur(15px); }
        
        .option {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            padding: 18px; border-radius: 15px; color: #fff; text-align: right; 
            margin-bottom: 10px; cursor: pointer; transition: 0.2s;
        }
        .option.correct { background: var(--green) !important; color: #000; }
        .option.wrong { background: var(--red) !important; color: #fff; }

        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--cyan); width: 0%; transition: 0.4s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <header>
        <div class="logo">SCIENCE SYSTEM V3</div>
        <div id="stats" style="font-family: 'Orbitron'; font-size: 14px;">XP: <span id="xpDisplay">0</span> | LVL: <span id="lvlDisplay">1</span></div>
    </header>

    <div id="medical-alert" class="medical-warning">⚠️ אזהרה: המידע בקטגוריית רפואה הוא לימודי בלבד. אין להשתמש בו לייעוץ רפואי או טיפול!</div>

    <div id="menu-screen">
        <h2 style="font-family: 'Orbitron'; margin-bottom: 20px;">SELECT SUBJECT</h2>
        <div class="filter-grid" id="subject-filters">
            <button class="filter-btn active" onclick="setSubject('all', this)">כל המקצועות</button>
        </div>
        
        <h2 style="font-family: 'Orbitron'; margin-top: 30px;">CHOOSE LEVEL</h2>
        <div class="filter-grid" id="level-filters">
            <button class="filter-btn active" id="btn-lvl-1" onclick="setLevel(1, this)">LEVEL 1</button>
            <button class="filter-btn" id="btn-lvl-2" onclick="setLevel(2, this)" disabled>LEVEL 2 🔒</button>
            <button class="filter-btn" id="btn-lvl-3" onclick="setLevel(3, this)" disabled>LEVEL 3 🔒</button>
        </div>

        <button class="start-btn" onclick="startQuiz()">LAUNCH MISSION</button>
    </div>

    <div id="quiz-screen">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div class="card">
            <div id="qCategory" style="color: var(--cyan); font-family: 'Orbitron'; font-size: 12px; margin-bottom: 10px;"></div>
            <h2 id="qText" style="margin-bottom: 25px;">טוען שאלה...</h2>
            <div id="opts"></div>
            <button id="nextBtn" class="start-btn" style="display:none; font-size: 14px;" onclick="renderQuestion()">השאלה הבאה ➔</button>
        </div>
    </div>

    <div id="level-up-screen" class="card" style="text-align: center;">
        <h1 style="font-family: 'Orbitron'; color: var(--green); font-size: 40px;">LEVEL UP!</h1>
        <p id="levelUpText" style="margin: 20px 0; font-size: 18px;"></p>
        <button class="start-btn" onclick="location.reload()">חזרה לתפריט ופתיחת רמה חדשה</button>
    </div>
</div>

<script>
    // מאגר שאלות לדוגמה (תחליף ב-JSON המלא שלך)
    const MASTER_DB = [
        {l:1, t:"רפואה", q:"מהו לחץ דם תקין בממוצע?", o:["120/80","180/100","90/60","150/90"], a:0},
        {l:1, t:"פיזיקה", q:"מהירות הקול גבוהה יותר במים מאשר באוויר?", o:["נכון","לא נכון"], a:0},
        {l:2, t:"ביולוגיה", q:"איזה הורמון מווסת את רמת הסוכר בדם?", o:["אדרנלין","אינסולין","טירוקסין","קורטיזול"], a:1},
        // ... המאגר שלך ממשיך כאן
    ];

    let currentSubject = 'all';
    let currentLevel = 1;
    let filteredQuestions = [];
    let currentIndex = 0;
    let xp = parseInt(localStorage.getItem('xp')) || 0;
    let unlockedLevel = parseInt(localStorage.getItem('unlockedLevel')) || 1;

    const sndCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
    const sndWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');

    function init() {
        // עדכון UI
        document.getElementById('xpDisplay').innerText = xp;
        document.getElementById('lvlDisplay').innerText = unlockedLevel;
        
        // פתיחת כפתורי רמות
        for(let i=1; i<=unlockedLevel; i++) {
            const btn = document.getElementById(`btn-lvl-${i}`);
            if(btn) {
                btn.disabled = false;
                if(i > 1) btn.innerText = `LEVEL ${i}`;
            }
        }

        // יצירת כפתורי מקצועות
        const subjects = [...new Set(MASTER_DB.map(i => i.t))];
        const filterGrid = document.getElementById('subject-filters');
        subjects.forEach(s => {
            const b = document.createElement('button');
            b.className = 'filter-btn';
            b.innerText = s;
            b.onclick = () => setSubject(s, b);
            filterGrid.appendChild(b);
        });
    }

    function setSubject(s, btn) {
        document.querySelectorAll('#subject-filters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSubject = s;
        // הצגת אזהרה אם נבחר רפואה
        document.getElementById('medical-alert').style.display = (s === 'רפואה' || s === 'all') ? 'block' : 'none';
    }

    function setLevel(l, btn) {
        document.querySelectorAll('#level-filters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLevel = l;
    }

    function startQuiz() {
        filteredQuestions = MASTER_DB.filter(q => 
            (currentSubject === 'all' || q.t === currentSubject) && q.l === currentLevel
        ).sort(() => Math.random() - 0.5);

        if(filteredQuestions.length === 0) return alert("אין שאלות ברמה/מקצוע הזה כרגע.");

        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        renderQuestion();
    }

    function renderQuestion() {
        if(currentIndex >= filteredQuestions.length) {
            handleLevelComplete();
            return;
        }

        const q = filteredQuestions[currentIndex];
        document.getElementById('qCategory').innerText = q.t.toUpperCase();
        document.getElementById('qText').innerText = q.q;
        document.getElementById('nextBtn').style.display = 'none';
        
        const optsDiv = document.getElementById('opts');
        optsDiv.innerHTML = '';

        q.o.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option';
            b.innerText = opt;
            b.onclick = () => checkAnswer(i, b, q.a);
            optsDiv.appendChild(b);
        });

        document.getElementById('progress-fill').style.width = (currentIndex / filteredQuestions.length * 100) + "%";
    }

    function checkAnswer(idx, btn, correct) {
        const all = document.querySelectorAll('.option');
        all.forEach(b => b.disabled = true);

        if(idx === correct) {
            btn.classList.add('correct');
            sndCorrect.play();
            confetti({ particleCount: 50, spread: 70, origin: { y: 0.8 } });
            xp += 10;
            localStorage.setItem('xp', xp);
            document.getElementById('xpDisplay').innerText = xp;
        } else {
            btn.classList.add('wrong');
            all[correct].classList.add('correct');
            sndWrong.play();
        }
        document.getElementById('nextBtn').style.display = 'block';
    }

    function handleLevelComplete() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('level-up-screen').style.display = 'block';
        
        if(currentLevel === unlockedLevel && unlockedLevel < 3) {
            unlockedLevel++;
            localStorage.setItem('unlockedLevel', unlockedLevel);
            document.getElementById('levelUpText').innerText = `מדהים! סיימת את רמה ${currentLevel} ופתחת את רמה ${unlockedLevel}!`;
            confetti({ particleCount: 200, spread: 100 });
        } else {
            document.getElementById('levelUpText').innerText = `סיימת את כל השאלות בסינון הנוכחי!`;
        }
    }

    // אנימציית רקע
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    for(let i=0; i<50; i++) pts.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, v:0.5});
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "rgba(0, 245, 255, 0.1)";
        pts.forEach(p => {
            p.y -= p.v; if(p.y < 0) p.y = canvas.height;
            ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw(); init();
</script>
</body>
</html>
