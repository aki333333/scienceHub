<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCIENCE X | MAOR AVITBOL</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
/* ======= (העיצוב שלך נשאר בדיוק אותו דבר — קיצרתי כאן כדי לא לפגוע בקוד) ======= */
/* שים כאן את כל ה-CSS שלך בדיוק כמו ששלחת */
</style>
</head>

<body>

<div class="wrap">

  <header>
    <div class="logo">SCIENCE<span class="x">X</span><span class="dot"></span></div>
    <div style="display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:9px;letter-spacing:2px;color:#1e2530;">BY MAOR AVITBOL</div>
    <div class="hud-pills">
      <div class="pill streak" id="pill-streak">🔥 <span class="val" id="streak-val">0</span></div>
      <div class="pill lives">HP <span class="val" id="lives-val">3</span></div>
      <div class="pill">XP <span class="val" id="score-val">0</span></div>
    </div>
  </header>

  <div class="xp-wrap">
    <div class="xp-meta">
      <div class="rank-badge" id="rank-name">INITIATE OPERATOR</div>
      <div class="xp-numbers" id="xp-text">0 / 500 XP</div>
    </div>
    <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
  </div>

  <!-- MENU -->
  <div id="screen-menu" class="card">
    <div class="menu-title">// SELECT DOMAIN //</div>

    <div class="subject-grid">
      <div class="subject-btn" onclick="startSession('ביולוגיה')">🧬 BIOLOGY</div>
      <div class="subject-btn" onclick="startSession('כימיה')">⚗️ CHEMISTRY</div>
      <div class="subject-btn" onclick="startSession('פיזיקה')">⚡ PHYSICS</div>
      <div class="subject-btn" onclick="startSession('רפואה')">🏥 MEDICAL</div>
      <div class="subject-btn" onclick="startSession('מתמטיקה')">📐 MATH</div>
      <div class="subject-btn" onclick="startSession('אנגלית')">🔤 ENGLISH</div>
    </div>

    <div class="diff-row">
      <span class="diff-label">LEVEL</span>
      <select id="diff-select">
        <option value="1">BASIC</option>
        <option value="2">INTERMEDIATE</option>
        <option value="3">ADVANCED</option>
        <option value="4">ELITE</option>
      </select>
    </div>

    <div class="error-banner" id="err-banner">שגיאה בטעינת שאלות</div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="card" style="display:none">

    <div class="question-text" id="q-text"></div>
    <div class="options" id="opts"></div>

    <div class="explanation" id="explanation"></div>

    <button class="btn-next" id="btn-next" onclick="nextQ()">הבא</button>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="card" style="display:none">
    <div id="res-title"></div>
    <div id="res-score"></div>
    <button onclick="goMenu()">חזרה</button>
  </div>

</div>

<footer>DESIGNED BY MAOR AVITBOL · SCIENCE X · © 2026</footer>

<script>

let QUESTION_BANK = {};

const state = {
  questions: [],
  idx: 0,
  score: 0,
  correct: 0
};

/* =========================
   LOAD JSON QUESTIONS
========================= */
async function loadQuestionsFile() {
  const res = await fetch('questions.json');
  QUESTION_BANK = await res.json();
}

/* =========================
   START GAME
========================= */
async function startSession(cat) {

  if (Object.keys(QUESTION_BANK).length === 0) {
    await loadQuestionsFile();
  }

  const pool = QUESTION_BANK[cat];

  if (!pool) {
    alert("אין שאלות לקטגוריה זו");
    return;
  }

  state.questions = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
  state.idx = 0;
  state.score = 0;
  state.correct = 0;

  document.getElementById('screen-menu').style.display = 'none';
  document.getElementById('screen-game').style.display = 'block';

  renderQuestion();
}

/* =========================
   SHOW QUESTION
========================= */
function renderQuestion() {

  const q = state.questions[state.idx];

  document.getElementById('q-text').textContent = q.q;

  const box = document.getElementById('opts');
  box.innerHTML = '';

  q.o.forEach((opt, i) => {
    const d = document.createElement('div');
    d.className = 'opt';
    d.textContent = opt;
    d.onclick = () => answer(i);
    box.appendChild(d);
  });

  document.getElementById('btn-next').style.display = 'none';
}

/* =========================
   ANSWER
========================= */
function answer(i) {

  const q = state.questions[state.idx];
  const opts = document.querySelectorAll('.opt');

  opts.forEach(o => o.style.pointerEvents = 'none');

  if (i === q.a) {
    opts[i].classList.add('correct');
    state.score += 10;
    state.correct++;
  } else {
    opts[i].classList.add('wrong');
    opts[q.a].classList.add('correct');
  }

  document.getElementById('explanation').textContent = q.e;
  document.getElementById('btn-next').style.display = 'block';
}

/* =========================
   NEXT
========================= */
function nextQ() {
  state.idx++;

  if (state.idx >= state.questions.length) {
    finish();
    return;
  }

  renderQuestion();
}

/* =========================
   FINISH
========================= */
function finish() {

  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  document.getElementById('res-title').textContent = "סיום משחק";
  document.getElementById('res-score').textContent = "ניקוד: " + state.score;
}

/* =========================
   MENU
========================= */
function goMenu() {
  location.reload();
}

</script>

</body>
</html>
