<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE X - THE ORIGINAL LOGIC</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Heebo:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyan: #00f5ff; --blue: #0066ff; --purple: #a020f0; --green: #00ff88; --red: #ff4466;
            --bg: #050a15; --card: rgba(15, 25, 45, 0.7); --border: rgba(0, 245, 255, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Heebo', sans-serif; background: var(--bg); color: #fff; overflow: hidden; height: 100vh; }

        #bg-canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 10; }

        header { 
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            background: var(--card); border-radius: 15px; border: 1px solid var(--border);
            backdrop-filter: blur(10px); margin-bottom: 20px;
        }
        .logo { font-family: 'Orbitron'; font-weight: 900; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }

        .screen { display: none; flex-direction: column; height: 100%; animation: slideIn 0.3s ease-out; }
        .screen.active { display: flex; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-main {
            background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 15px;
            color: #fff; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 1.1rem;
            margin-bottom: 12px;
        }
        .btn-main:hover:not(:disabled) { border-color: var(--cyan); background: rgba(0, 245, 255, 0.1); }
        .btn-main:disabled { opacity: 0.3; cursor: not-allowed; }

        .card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; backdrop-filter: blur(15px); }
        .option {
            width: 100%; padding: 16px; margin-bottom: 10px; border-radius: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: #fff; text-align: right; cursor: pointer; transition: 0.2s;
        }
        .option.correct { background: var(--green) !important; color: #000; font-weight: bold; box-shadow: 0 0 15px var(--green); }
        .option.wrong { background: var(--red) !important; box-shadow: 0 0 15px var(--red); }
        .option.dim { opacity: 0.2; pointer-events: none; }

        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--cyan); width: 0%; transition: 0.4s; }

        .btn-next { width: 100%; padding: 18px; background: var(--cyan); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; display: none; }
        .streak-badge { display: none; color: #ffae00; font-family: 'Orbitron'; animation: pulse 0.6s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <header>
        <div class="logo">SCIENCE X</div>
        <div id="streak-ui" class="streak-badge">🔥 <span id="streak-num">0</span> STREAK</div>
        <div style="font-family:'Orbitron'; color:var(--cyan)">XP: <span id="xp-val">0</span></div>
    </header>

    <div id="screen-menu" class="screen active">
        <h2 style="text-align: center; margin-bottom: 25px; font-family: 'Orbitron'; color: var(--cyan);">SELECT MISSION</h2>
        <button class="btn-main" onclick="loadQuestions('רפואה')">MEDICAL / רפואה</button>
        <button class="btn-main" onclick="loadQuestions('פיזיקה')">PHYSICS / פיזיקה</button>
        <button class="btn-main" onclick="loadQuestions('כימיה')">CHEMISTRY / כימיה</button>
        <button id="btn-lvl2" class="btn-main" onclick="loadQuestions('lvl2')" disabled>🔒 LEVEL 2 (200 XP)</button>
    </div>

    <div id="screen-quiz" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <button onclick="useHint()" id="hint-btn" style="background:none; border:1px solid var(--purple); color:var(--purple); padding:4px 12px; border-radius:8px; cursor:pointer; font-size:11px;">50/50 HINT</button>
            <span id="q-info" style="font-size: 12px; opacity: 0.5;"></span>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="q-card" class="card">
            <div id="q-text" style="font-size:1.3rem; margin-bottom:20px; text-align:center;"></div>
            <div id="options-box"></div>
            <button id="next-btn" class="btn-next" onclick="renderNext()">NEXT QUESTION ➔</button>
        </div>
    </div>

    <div id="screen-finish" class="screen card" style="text-align: center; justify-content: center;">
        <h1 style="color: var(--green); font-family: 'Orbitron';">MISSION CLEARED</h1>
        <p id="finish-msg" style="margin: 20px 0; font-size: 1.2rem;"></p>
        <button class="btn-main" onclick="location.reload()">RESTART</button>
    </div>
</div>

<script>
    // סאונדים
    const sfx = {
        correct: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
        wrong: new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3'),
        click: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3')
    };
    function play(t) { sfx[t].currentTime = 0; sfx[t].play().catch(()=>{}); }

    let MASTER_DB = [];
    let activeQuestions = [], currentIdx = 0, streak = 0;
    let xp = parseInt(localStorage.getItem('scix_xp')) || 0;

    // --- לוגיקת ה-Fetch המקורית שביקשת ---
    async function loadQuestions(type) {
        play('click');
        try {
            const response = await fetch('questions.json'); // קורא לקובץ הג'ייסון שלך
            MASTER_DB = await response.json();
            
            activeQuestions = MASTER_DB.filter(q => (type==='lvl2' ? q.l===2 : (q.t===type && q.l===1)))
                                       .sort(() => Math.random() - 0.5);
            
            if(!activeQuestions.length) return alert("לא נמצאו שאלות.");
            currentIdx = 0; streak = 0;
            show('screen-quiz');
            renderNext();
        } catch (e) {
            alert("שגיאה בטעינת קובץ questions.json. וודא שהקובץ נמצא באותה תיקייה.");
        }
    }

    function renderNext() {
        if(currentIdx >= activeQuestions.length) return finish();
        const q = activeQuestions[currentIdx];
        document.getElementById('q-card').classList.remove('shake');
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('q-info').innerText = `${currentIdx + 1} / ${activeQuestions.length}`;
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('hint-btn').disabled = (xp < 25);
        
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        q.o.forEach((o, i) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = o;
            btn.onclick = () => check(i, btn, q.a);
            box.appendChild(btn);
        });
        document.getElementById('progress-fill').style.width = (currentIdx / activeQuestions.length * 100) + "%";
    }

    function check(i, btn, a) {
        const options = document.querySelectorAll('.option');
        options.forEach(opt => opt.disabled = true);

        if(i === a) {
            btn.classList.add('correct');
            streak++;
            xp += (10 + streak);
            play('correct');
            confetti({ particleCount: 40 + (streak*5), spread: 60, origin: { y: 0.8 } });
        } else {
            btn.classList.add('wrong');
            options[a].classList.add('correct');
            document.getElementById('q-card').classList.add('shake');
            streak = 0;
            play('wrong');
        }
        
        currentIdx++;
        updateStats();
        document.getElementById('next-btn').style.display = 'block';
    }

    function useHint() {
        if(xp < 25) return;
        const q = activeQuestions[currentIdx - 1];
        const options = Array.from(document.querySelectorAll('.option'));
        let count = 0;
        options.forEach((opt, i) => {
            if(i !== q.a && count < 2) {
                opt.classList.add('dim');
                count++;
            }
        });
        xp -= 25; updateStats();
        document.getElementById('hint-btn').disabled = true;
    }

    function updateStats() {
        localStorage.setItem('scix_xp', xp);
        document.getElementById('xp-val').innerText = xp;
        if(xp >= 200) document.getElementById('btn-lvl2').disabled = false;
        if(streak >= 3) {
            document.getElementById('streak-ui').style.display = 'block';
            document.getElementById('streak-num').innerText = streak;
        } else {
            document.getElementById('streak-ui').style.display = 'none';
        }
    }

    function finish() {
        show('screen-finish');
        document.getElementById('finish-msg').innerText = `צברת ${xp} XP בסך הכל!`;
        confetti({ particleCount: 150, spread: 100 });
    }

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // רקע חלקיקים
    const c = document.getElementById('bg-canvas');
    const ctx = c.getContext('2d');
    function res() { c.width = window.innerWidth; c.height = window.innerHeight; }
    res(); window.onresize = res;
    let pts = Array(40).fill().map(() => ({x:Math.random()*c.width, y:Math.random()*c.height, v:0.4}));
    function draw() {
        ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle = "rgba(0, 245, 255, 0.1)";
        pts.forEach(p => { p.y -= p.v; if(p.y < 0) p.y = c.height; ctx.fillRect(p.x, p.y, 2, 2); });
        requestAnimationFrame(draw);
    }
    draw(); updateStats();
</script>
</body>
</html>
