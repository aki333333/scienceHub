<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן הידע הגדול 🧠✨</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .header {
            margin-bottom: 2rem;
        }

        .progress-container {
            background: #334155;
            height: 12px;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .stats {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .question-box {
            margin-bottom: 2rem;
        }

        .category-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: var(--primary);
            margin-bottom: 10px;
        }

        h2 { margin: 10px 0; font-size: 1.5rem; }

        .options {
            display: grid;
            gap: 12px;
        }

        button.option {
            background: #334155;
            color: white;
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            text-align: right;
        }

        button.option:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        button.correct { background: var(--success) !important; border-color: #4ade80; }
        button.wrong { background: var(--danger) !important; border-color: #f87171; }

        .explanation {
            margin-top: 1.5rem;
            padding: 15px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 10px;
            display: none;
        }

        .next-btn {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div id="category" class="category-tag">טוען...</div>
        <div class="stats">נשארו <span id="remaining">0</span> מתוך <span id="total">0</span> שאלות 🎯</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div class="question-box">
        <h2 id="question-text">טוען שאלה...</h2>
        <div id="options" class="options"></div>
    </div>

    <div id="explanation" class="explanation"></div>
    <button id="next-btn" class="next-btn" onclick="loadNextQuestion()">לשאלה הבאה ➔</button>
</div>

<script>
    // מאגר ה-JSON המאוחד (קיצרתי מעט כדי שייכנס כאן, תוכל להוסיף את כל ה-400 באותו פורמט)
    const questionsDB = [
        {"l":1,"t":"ביולוגיה","q":"מה הוא ה'תחנת הכוח' של התא? 🧬","o":["גרעין","מיטוכונדריה","ריבוזום","ממברנה"],"a":1,"e":"המיטוכונדריה מייצרת ATP – אנרגיה לתא."},
        {"l":1,"t":"כימיה","q":"מהו H₂O? 🧪","o":["מלח","מים","סוכר","חמצן"],"a":1,"e":"מים מורכבים משני אטומי מימן ואטום חמצן אחד."},
        {"l":2,"t":"מתמטיקה","q":"מהו שטח עיגול? 🧮","o":["2πr","πr²","πd","2r"],"a":1,"e":"שטח עיגול מחושב כפאי כפול הרדיוס בריבוע."},
        {"l":1,"t":"פיזיקה","q":"מהו כוח המשיכה של כדור הארץ (g)? ⚡","o":["5.8 m/s²","9.8 m/s²","12 m/s²","1.6 m/s²"],"a":1,"e":"תאוצת הכובד הממוצעת היא 9.8 מטר לשנייה בריבוע."},
        {"l":1,"t":"רפואה","q":"מהו האיבר הגדול ביותר בגוף? 🩺","o":["כבד","עור","ריאות","מעי דק"],"a":1,"e":"העור הוא האיבר בעל השטח הגדול ביותר."},
        {"l":1,"t":"אנגלית","q":"What is the past tense of 'Go'? 🌎","o":["Goed","Went","Gone","Going"],"a":1,"e":"'Went' היא הצורה הלא-רגילה של הפועל בעבר."}
    ];

    let currentQuestionIndex = 0;
    let answeredIndices = JSON.parse(localStorage.getItem('answeredQuestions')) || [];

    function init() {
        if (answeredIndices.length === questionsDB.length) {
            alert("כל הכבוד! סיימת את כל המאגר! 🏆");
            answeredIndices = []; // איפוס לצורך הדגמה
        }
        
        // מוצא שאלה שטרם נענתה
        let nextIndex = 0;
        while (answeredIndices.includes(nextIndex) && answeredIndices.length < questionsDB.length) {
            nextIndex++;
        }
        currentQuestionIndex = nextIndex;
        displayQuestion();
        updateStats();
    }

    function updateStats() {
        const total = questionsDB.length;
        const answered = answeredIndices.length;
        document.getElementById('total').innerText = total;
        document.getElementById('remaining').innerText = total - answered;
        document.getElementById('progress-bar').style.width = (answered / total * 100) + "%";
    }

    function displayQuestion() {
        const q = questionsDB[currentQuestionIndex];
        document.getElementById('category').innerText = q.t;
        document.getElementById('question-text').innerText = q.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        q.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsDiv.appendChild(btn);
        });

        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedIndex, btn) {
        const q = questionsDB[currentQuestionIndex];
        const allButtons = document.querySelectorAll('.option');
        
        allButtons.forEach(b => b.disabled = true);

        if (selectedIndex === q.a) {
            btn.classList.add('correct');
            if (!answeredIndices.includes(currentQuestionIndex)) {
                answeredIndices.push(currentQuestionIndex);
                localStorage.setItem('answeredQuestions', JSON.stringify(answeredIndices));
            }
        } else {
            btn.classList.add('wrong');
            allButtons[q.a].classList.add('correct');
        }

        const exp = document.getElementById('explanation');
        exp.innerText = "💡 " + q.e;
        exp.style.display = 'block';
        document.getElementById('next-btn').style.display = 'inline-block';
        updateStats();
    }

    function loadNextQuestion() {
        init();
    }

    init();
</script>

</body>
</html>
