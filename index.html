<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE X | DEVELOPED BY MAOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cyan: #00f5ff; --red: #ff3e3e; --green: #00ff88; --bg: #03070c;
            --carbon: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.04) 1px, transparent 0);
            --neon-glow: 0 0 15px rgba(0,245,255,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Heebo', sans-serif; background: var(--bg); color: #fff; 
            overflow-x: hidden; min-height: 100vh;
            background-image: var(--carbon); background-size: 6px 6px;
        }

        #particles-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.3; }
        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; padding: 25px; }

        /* --- UI HEADER --- */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-family: 'Orbitron'; font-weight: 900; font-size: 1.8rem; color: var(--cyan); text-shadow: var(--neon-glow); }
        .maor-badge { font-family: 'Orbitron'; font-size: 10px; color: var(--cyan); border: 1px solid var(--cyan); padding: 4px 10px; border-radius: 4px; letter-spacing: 2px; }

        .hud { 
            display: flex; gap: 25px; align-items: center; background: rgba(255,255,255,0.02); 
            padding: 15px 30px; border-radius: 15px; border: 1px solid rgba(0,245,255,0.1); backdrop-filter: blur(12px);
        }

        /* --- PRO HEARTS (SVG) --- */
        .hearts-box { display: flex; gap: 10px; }
        .heart-icon { width: 24px; height: 24px; fill: var(--red); filter: drop-shadow(0 0 8px var(--red)); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .heart-icon.empty { fill: #1a1a1a; filter: none; transform: scale(0.8); opacity: 0.3; }

        /* --- PROGRESS SYSTEM --- */
        .xp-engine { width: 100%; margin: 25px 0; }
        .xp-top { display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 12px; margin-bottom: 10px; color: var(--cyan); }
        .xp-track { height: 10px; background: rgba(255,255,255,0.03); border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        #xp-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #0066ff, var(--cyan)); transition: 0.7s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 20px rgba(0,245,255,0.5); }

        /* --- GAME CARD --- */
        #game-frame { display: none; }
        .card { 
            background: linear-gradient(145deg, rgba(15,20,30,0.95), rgba(5,10,15,0.98)); 
            border: 1px solid rgba(0,245,255,0.15); border-radius: 40px; padding: 50px; 
            position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.9);
        }

        .streak-fire { 
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #ff9900, #ff2200); padding: 12px 35px;
            border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; display: none;
            box-shadow: 0 0 30px #ff4400; animation: fire-pulse 0.4s infinite alternate;
        }
        @keyframes fire-pulse { from { transform: translateX(-50%) scale(1); opacity: 0.9; } to { transform: translateX(-50%) scale(1.1); opacity: 1; } }

        .q-text { font-size: 2rem; font-weight: 900; margin-bottom: 35px; line-height: 1.2; text-align: center; }

        .opt-grid { display: grid; gap: 15px; }
        .opt-btn { 
            width: 100%; padding: 22px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02); color: #fff; cursor: pointer; text-align: right;
            font-size: 1.2rem; transition: 0.3s;
        }
        .opt-btn:hover:not(:disabled) { background: rgba(0,245,255,0.08); border-color: var(--cyan); transform: translateX(-5px); }
        .opt-btn.correct { background: var(--green) !important; color: #000; font-weight: 900; border-color: var(--green); box-shadow: 0 0 30px rgba(0,255,136,0.4); }
        .opt-btn.wrong { background: var(--red) !important; border-color: var(--red); box-shadow: 0 0 30px rgba(255,62,62,0.4); }

        .action-btn { width: 100%; padding: 22px; background: var(--cyan); color: #000; border: none; border-radius: 18px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; margin-top: 30px; display: none; transition: 0.2s; }
        .action-btn:hover { background: #fff; transform: scale(1.02); }

        /* --- MENU --- */
        .sector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-top: 40px; }
        .sector-card { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(0,245,255,0.1); 
            padding: 50px 20px; border-radius: 30px; cursor: pointer; transition: 0.4s; text-align: center;
        }
        .sector-card:hover { border-color: var(--cyan); background: rgba(0,245,255,0.08); transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,245,255,0.1); }
        .sector-card h3 { font-family: 'Orbitron'; margin-top: 15px; color: var(--cyan); }

        /* --- FOOTER --- */
        footer { margin-top: 80px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 30px; font-family: 'Orbitron'; font-size: 11px; color: rgba(255,255,255,0.2); }
        .maor-sig { color: var(--cyan); font-weight: 900; text-shadow: 0 0 5px var(--cyan); }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="container">
    <header>
        <div class="logo">SCIENCE X</div>
        <div class="maor-badge">CHIEF ARCHITECT: MAOR</div>
        <div class="hud">
            <div class="hearts-box" id="hearts-ui">
                <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div id="xp-display" style="font-family:'Orbitron'; font-weight:900; color:var(--cyan); min-width:80px; text-align:right;">0 XP</div>
        </div>
    </header>

    <div class="xp-engine">
        <div class="xp-top"><span>CORE SYNCHRONIZATION</span><span id="lvl-tag">RANK: INITIATE</span></div>
        <div class="xp-track"><div id="xp-bar"></div></div>
    </div>

    <main id="menu-frame">
        <h2 style="text-align:center; font-family:'Orbitron'; letter-spacing:5px; margin-bottom:10px;">SELECT DOMAIN</h2>
        <div class="sector-grid">
            <div class="sector-card" onclick="init('ביולוגיה')"><h1>🧬</h1><h3>BIOLOGY</h3></div>
            <div class="sector-card" onclick="init('כימיה')"><h1>🧪</h1><h3>CHEMISTRY</h3></div>
            <div class="sector-card" onclick="init('פיזיקה')"><h1>⚡</h1><h3>PHYSICS</h3></div>
            <div class="sector-card" onclick="init('רפואה')"><h1>⚕️</h1><h3>MEDICAL</h3></div>
        </div>
    </main>

    <main id="game-frame">
        <div class="card">
            <div id="streak-fire" class="streak-fire">STREAK: <span id="fire-count">0</span> 🔥</div>
            <div class="q-text" id="question-label">INITIALIZING MISSION...</div>
            <div class="opt-grid" id="options-holder"></div>
            <button id="btn-next" class="action-btn" onclick="next()">NEXT SEQUENCE ➔</button>
        </div>
    </main>

    <footer>
        ENGINEERED BY <span class="maor-sig">MAOR</span> | ALL SYSTEM RIGHTS RESERVED<br>
        &copy; 2026 SCIENCE X INFRASTRUCTURE | VERSION 7.0.4
    </footer>
</div>

<script>
// --- AUDIO (PRO ASSETS) ---
const sfx = {
    ok: new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'),
    no: new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'),
    end: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3')
};

// --- SYSTEM LOGIC ---
let db = [], mission = [], cur = 0, xp = 0, lives = 3, streak = 0;

async function boot() {
    try {
        const r = await fetch('questions.json');
        db = await r.json();
    } catch(e) { console.error("Database offline."); }
}

function init(cat) {
    mission = db.filter(q => q.t === cat).sort(() => 0.5 - Math.random());
    if(!mission.length) return alert("Domain empty.");
    document.getElementById('menu-frame').style.display = 'none';
    document.getElementById('game-frame').style.display = 'block';
    next();
}

function next() {
    if(cur >= mission.length) {
        sfx.end.play();
        confetti({ particleCount: 300, spread: 120, origin: { y: 0.6 } });
        alert("DOMAIN CLEARED!");
        location.reload();
        return;
    }

    const q = mission[cur];
    document.getElementById('question-label').innerText = q.q;
    const holder = document.getElementById('options-holder');
    holder.innerHTML = '';
    
    q.o.forEach((t, i) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = t;
        b.onclick = () => verify(i, b, q.a);
        holder.appendChild(b);
    });

    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('streak-fire').style.display = streak >= 3 ? 'block' : 'none';
    document.getElementById('fire-count').innerText = streak;
}

function verify(idx, btn, ans) {
    const all = document.querySelectorAll('.opt-btn');
    all.forEach(b => b.disabled = true);

    if(idx === ans) {
        btn.classList.add('correct');
        streak++;
        xp += (25 + (streak * 5));
        sfx.ok.play();
        confetti({ particleCount: 50, spread: 60, colors: ['#00f5ff', '#ffffff'] });
    } else {
        btn.classList.add('wrong');
        all[ans].classList.add('correct');
        streak = 0;
        lives--;
        sfx.no.play();
        syncHearts();
    }

    syncUI();
    cur++;
    document.getElementById('btn-next').style.display = 'block';
}

function syncHearts() {
    const hearts = document.querySelectorAll('.heart-icon');
    for(let i=0; i<3; i++) {
        if(i >= lives) hearts[2-i].classList.add('empty');
    }
    if(lives <= 0) {
        setTimeout(() => { alert("CRITICAL FAILURE: SYSTEM SHUTDOWN"); location.reload(); }, 600);
    }
}

function syncUI() {
    document.getElementById('xp-display').innerText = `${xp} XP`;
    const p = Math.min((xp / 1000) * 100, 100);
    document.getElementById('xp-bar').style.width = p + "%";
    if(xp > 500) document.getElementById('lvl-tag').innerText = "RANK: ELITE";
}

boot();

// Particle Engine
(function(){
    const c = document.getElementById('particles-canvas');
    const x = c.getContext('2d');
    let w, h;
    function r(){ w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
    window.onresize = r; r();
    function f(){
        x.clearRect(0,0,w,h); x.fillStyle = "rgba(0, 245, 255, 0.4)";
        for(let i=0; i<40; i++){
            x.beginPath(); x.arc(Math.random()*w, Math.random()*h, 1.2, 0, Math.PI*2); x.fill();
        }
        setTimeout(() => requestAnimationFrame(f), 80);
    }
    f();
})();
</script>
</body>
</html>
